name: S06.7 large rock actual surface audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/s06-large-rock-surface.yml']
permissions:
  contents: write
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - run: python tools/large_rock_surface_probe.py --output dist/s067-rock
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
      - name: Preserve proof
        run: |
          cp dist/s067-rock/large-rock-surface-proof.json games/maps/mapa-principal/docs/s06/resource-contact-v17/
          git config user.name "roblox-scene-sync[bot]"
          git config user.email "scene-sync@users.noreply.github.com"
          git add games/maps/mapa-principal/docs/s06/resource-contact-v17/large-rock-surface-proof.json
          git commit -m "evidence(s06.7): measure actual large rock support"
          git push origin HEAD:main
