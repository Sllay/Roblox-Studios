name: S02 native spatial index (read only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/s02-spatial.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  spatial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: python -m unittest discover -s tests -v
      - run: bash tools/install-luau.sh
      - uses: actions/cache@v4
        with:
          path: .rs-cache/surface
          key: rs-native-surface-v2-${{ hashFiles('tools/sync/terrain_atlas.luau', 'games/maps/mapa-principal/docs/sync/main/staging.json') }}
          restore-keys: rs-native-surface-v2-
      - name: Read pinned native terrain and plan candidate placements
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/spatial_engine.py
      - name: Offline replay (no cloud)
        run: python tools/spatial_engine.py --offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s02-spatial
          path: dist/s02/
          if-no-files-found: warn
