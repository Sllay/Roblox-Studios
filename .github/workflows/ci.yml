name: Validate and build Roblox places

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install image renderer
        run: python -m pip install Pillow==11.3.0
      - name: Structural validation
        run: python tools/workspace.py validate
      - name: Validate deployment mappings
        run: python tools/deploy.py validate
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Install pinned official Luau
        run: bash tools/install-luau.sh
      - name: Compile-check all Luau sources
        run: python tools/script_quality.py
      - name: Install pinned Roblox Luau LSP
        run: bash tools/install-luau-lsp.sh
      - name: Quality Gate 2.0 typed gameplay logic
        run: python tools/quality_gate_v2.py
      - name: Negative gate test - bad syntax must fail
        run: |
          BAD_FILE="$(mktemp --suffix=.luau)"
          printf 'local = invalid\n' > "$BAD_FILE"
          if luau-compile --null "$BAD_FILE"; then
            echo "::error::Luau compiler accepted invalid code"
            rm -f "$BAD_FILE"
            exit 1
          fi
          rm -f "$BAD_FILE"
          echo 'PASS: compiler rejected invalid code'
      - name: Install pinned Rojo via Rokit
        uses: CompeyDev/setup-rokit@v0.2.1
      - name: Verify Rojo
        run: rojo --version
      - name: Compile all places (no publishing)
        run: python tools/workspace.py build --all
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: roblox-places
          path: dist/**/*.rbxlx
          if-no-files-found: error
