name: Entre Reinos T2-R2 staging development preview

on:
  push:
    branches: [entre-reinos/t2-r2-society]
    paths: [games/maps/entre-reinos/docs/sync/t2-r2-preview/target.json]

permissions:
  actions: read
  contents: read

concurrency:
  group: roblox-place-write-entre-reinos-main-staging
  cancel-in-progress: false

jobs:
  staging-preview:
    if: ${{ github.repository == 'Sllay/Roblox-Studios' }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    env:
      CANDIDATE: c905eca3437ecd124c6afac6cce0df21df31f8e1
      PLAN: games/maps/entre-reinos/docs/sync/t2-r2-preview/target.json
      PREVIEW_TOOL: games/maps/entre-reinos/ops/t2_r2_preview.py
      EVIDENCE: dist/entre-reinos-t2-r2-preview
      PYTHONPATH: ${{ github.workspace }}/preview-candidate/tools
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c905eca3437ecd124c6afac6cce0df21df31f8e1
          path: preview-candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: f7d4ac685f2372d066cdf49a19b2b978f2454745
          path: preview-rollback
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check the reviewed source and existing successful runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(jq -er .action "$PLAN")" = publish
          test "$(jq -er .candidate "$PLAN")" = "$CANDIDATE"
          test "$(git -C preview-candidate rev-parse HEAD)" = "$CANDIDATE"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45694273900" \
            --jq '.conclusion + " " + .head_sha + " " + .path' \
            | grep -Fx "success $CANDIDATE .github/workflows/ci.yml"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45694260806" \
            --jq '.conclusion + " " + .head_sha + " " + .path' \
            | grep -Fx "success $CANDIDATE .github/workflows/entre-reinos-t2-r2-engine-probe.yml"
      - run: python -m pip install Pillow==11.3.0
      - name: Install pinned official Luau
        run: bash preview-candidate/tools/install-luau.sh
      - uses: CompeyDev/setup-rokit@v0.2.1
      - name: Build only the approved Entre Reinos Place
        working-directory: preview-candidate
        run: python tools/workspace.py build --game entre-reinos --place main
      - name: Build the exact v19 rollback file
        run: |
          (cd preview-rollback && python tools/workspace.py build --game entre-reinos --place main)
          mkdir -p "$EVIDENCE"
          cp preview-rollback/dist/entre-reinos/main.rbxlx "$EVIDENCE/entre-reinos-v19-rollback.rbxlx"
          printf '1c18dfcebe528e3aa693db951148607cc417a5632c5ebc4e0418d3397466b885  %s\n' \
            "$EVIDENCE/entre-reinos-v19-rollback.rbxlx" | sha256sum --check
      - name: Archive v19 rollback before publishing
        uses: actions/upload-artifact@v4
        with:
          name: entre-reinos-v19-rollback
          path: dist/entre-reinos-t2-r2-preview/entre-reinos-v19-rollback.rbxlx
          if-no-files-found: error
      - name: Verify v19 backup and Scene Sync, then publish staging through Open Cloud
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python "$PREVIEW_TOOL" publish --plan "$PLAN" --output "$EVIDENCE"
      - name: Independently read the published revision, Scene Sync and script hashes
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python "$PREVIEW_TOOL" readback --plan "$PLAN" --output "$EVIDENCE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: entre-reinos-t2-r2-preview
          path: dist/entre-reinos-t2-r2-preview/*.json
          if-no-files-found: ignore
