name: S09 Chicken V2 - reference-guided mesh
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/creature_factory/chicken_v2.py'
      - '.github/workflows/s09-chicken-v2.yml'
permissions:
  contents: write
concurrency:
  group: s09-chicken-v2
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 trimesh==4.7.4 pillow==11.3.0 numba==0.61.2
      - run: python tools/creature_factory/chicken_v2.py dist/creature/chicken-v2
      - name: Archive candidate
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          revision="asset-library/candidates/chicken-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python tools/asset_factory/persist_candidates.py dist/creature/chicken-v2 "$revision"
          git config user.name "asset-factory[bot]"
          git config user.email "asset-factory[bot]@users.noreply.github.com"
          git add "$revision"
          git commit -m "assets: archive S09 chicken V2 candidate ${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: s09-chicken-v2
          path: dist/creature/chicken-v2/
