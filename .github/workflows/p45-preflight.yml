name: P4.5 mobile feedback preflight (read only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/p45-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: bash tools/install-luau.sh
      - run: bash tools/install-luau-lsp.sh
      - run: python tools/script_quality.py
      - run: python tools/quality_gate_v2.py
      - run: python tools/p45_preflight.py
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p45-preflight
          path: dist/p45/
          if-no-files-found: warn
