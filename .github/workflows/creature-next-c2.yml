name: Creature Factory Next C2 evidence
on:
  pull_request:
    paths:
      - 'tools/creature_factory/next/evidence.py'
      - 'tools/creature_factory/next/cameras.py'
      - 'tools/creature_factory/next/dag.py'
      - 'tools/creature_factory/next/c2_benchmark.py'
      - 'tests/test_creature_next_c2.py'
      - '.github/workflows/creature-next-c2.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install evidence dependencies
        run: python -m pip install Pillow==11.3.0 numpy==2.2.6
      - name: C1 and C2 regression tests
        run: python -m unittest tests.test_creature_next_c1 tests.test_creature_next_c2 -v
      - name: Restore certified C1 fixture evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/Sllay/Roblox-Studios/actions/artifacts/14190612099/zip -o "$RUNNER_TEMP/c1.zip"
          echo "87eb505f4efaee2f58412844834e77523dda45a42cd42e795d1ca3da77b20f60  $RUNNER_TEMP/c1.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/c1.zip" -d "$RUNNER_TEMP/c1"
      - name: Benchmark actual masks, known cameras and legacy rabbit
        run: python -m tools.creature_factory.next.c2_benchmark "$RUNNER_TEMP/c1/c1-ci" dist/creature-next/c2ab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creature-next-c2ab
          path: dist/creature-next/c2ab/
          if-no-files-found: warn
