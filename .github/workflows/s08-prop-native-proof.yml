name: S08 Native Prop Proof
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/s08-prop-native-proof.yml']
permissions:
  contents: write
concurrency:
  group: s08-natural-prop-intake
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - name: Native detached verification
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          git config user.name "asset-factory[bot]"
          git config user.email "asset-factory[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          python tools/asset_factory/s08_prop_proof.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s08-native-prop-proof
          path: asset-library/roblox-receipts/s08-native-proof.json
          if-no-files-found: warn
