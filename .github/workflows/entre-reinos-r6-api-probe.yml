name: Entre Reinos R6 rig creation API probe (read-only, no Place write)
on:
  push:
    branches: [main]
    paths: [.github/workflows/entre-reinos-r6-api-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - name: Try documented engine R6 rig construction without persisting
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          PYTHONPATH=tools python - <<'PY'
          import json, os
          from cloud_tasks import run_task
          src = '''
          local H=game:GetService("HttpService")
          local Players=game:GetService("Players")
          local description=Instance.new("HumanoidDescription")
          local ok, result=pcall(function()
              return Players:CreateHumanoidModelFromDescriptionAsync(
                  description, Enum.HumanoidRigType.R6
              )
          end)
          local details={universeId=tostring(game.GameId),placeId=tostring(game.PlaceId),
              ok=ok,rig="unknown",hasRoot=false,hasTorso=false}
          if ok and typeof(result)=="Instance" then
              local h=result:FindFirstChildOfClass("Humanoid")
              details.rig=if h then h.RigType.Name else "missing_humanoid"
              details.hasRoot=result:FindFirstChild("HumanoidRootPart")~=nil
              details.hasTorso=result:FindFirstChild("Torso")~=nil
              result:Destroy()
          else
              details.reason=tostring(result):sub(1,250)
          end
          description:Destroy()
          return H:JSONEncode(details)
          '''
          result=run_task("10769712413","90623742498445",os.environ["ROBLOX_OPEN_CLOUD_API_KEY"],src)
          print("R6_API_PROBE",json.dumps({k:v for k,v in result.items() if k in
               ("ok","rig","hasRoot","hasTorso","reason","loadedVersion")},sort_keys=True))
          if result["ok"]:
              assert result["rig"]=="R6" and result["hasRoot"] and result["hasTorso"]
          PY
