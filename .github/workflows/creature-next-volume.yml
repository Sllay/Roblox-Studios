name: Creature Factory Next C3 volumetric reconstruction
on:
  pull_request:
    paths:
      - 'tools/creature_factory/next/volumetric_reconstruction.py'
      - 'tools/creature_factory/next/volume_benchmark.py'
      - 'tests/test_creature_next_volume.py'
      - '.github/workflows/creature-next-volume.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  volume:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 scipy==1.13.1 scikit-image==0.24.0 Pillow==11.3.0 opencv-python-headless==4.11.0.86 trimesh==4.6.8
      - run: python -m unittest tests.test_creature_next_volume -v
      - name: Restore immutable measured geometry and neural candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for pair in "14190612099 87eb505f4efaee2f58412844834e77523dda45a42cd42e795d1ca3da77b20f60 c1" "14208510222 64dc03dbb810cd2518d6b082920e42e7195f1a986ae7ce5e415b624f4a95b474 rabbit" "14207912279 f13996a904665c9206a77bda81edae6bbb33a7d887c602998f62a771a32f6338 fantasy" "14208102006 c8ad95c733ce2e1bf15fdf8a294627b7ea4405261938f8be997d406092cf7af4 align"; do
            read -r id hash name <<< "$pair"
            curl --fail --location --silent --show-error --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/Sllay/Roblox-Studios/actions/artifacts/$id/zip" -o "$RUNNER_TEMP/$name.zip"
            echo "$hash  $RUNNER_TEMP/$name.zip" | sha256sum -c -
            unzip -q "$RUNNER_TEMP/$name.zip" -d "$RUNNER_TEMP/$name"
          done
      - run: python -u -m tools.creature_factory.next.volume_benchmark "$RUNNER_TEMP/c1/c1-ci" "$RUNNER_TEMP/rabbit" "$RUNNER_TEMP/fantasy" "$RUNNER_TEMP/align" dist/creature-next/c3volume
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creature-next-c3volume
          path: dist/creature-next/c3volume/
          if-no-files-found: warn
