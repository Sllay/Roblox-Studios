name: S06.4 resume original rig import before any POST
on:
  push:
    branches: [main]
    paths: ['games/maps/mapa-principal/docs/s06-rig-resume.trigger']
permissions:
  contents: write
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - name: Reserve resume only after proven pre-POST failure
        run: |
          test -f games/maps/mapa-principal/docs/s06/wind-v16/upload-intent.json
          test ! -e games/maps/mapa-principal/docs/s06/wind-v16/upload-receipt.json
          test ! -e games/maps/mapa-principal/docs/s06/wind-v16/resume-intent.json
          printf '%s\n' '{"priorRun":43282472483,"reason":"creator scope dispatch failed compilation before request and receipt; no POST reached","retryAllowed":false}' > games/maps/mapa-principal/docs/s06/wind-v16/resume-intent.json
          git config user.name "roblox-scene-sync[bot]"
          git config user.email "scene-sync@users.noreply.github.com"
          git add games/maps/mapa-principal/docs/s06/wind-v16/resume-intent.json
          git commit -m "chore(s06.4): resume original upload after proven pre-POST failure"
          git push origin HEAD:main
      - name: Submit once and inspect original prototype
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/assets/upload_canopy.py --rig games/maps/mapa-principal/docs/s06/wind-v16/pine-canopy.glb --output dist/s06-4
      - name: Preserve receipt
        if: always()
        run: |
          if test -f dist/s06-4/upload-receipt.json; then
            cp dist/s06-4/upload-receipt.json games/maps/mapa-principal/docs/s06/wind-v16/upload-receipt.json
            git add games/maps/mapa-principal/docs/s06/wind-v16/upload-receipt.json
            git commit -m "evidence(s06.4): original model upload receipt"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s06-4-import-receipt
          path: dist/s06-4/
          if-no-files-found: warn
