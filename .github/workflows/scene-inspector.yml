name: Scene Inspector - Read Only Open Cloud

on:
  workflow_dispatch:
    inputs:
      game:
        description: Game slug
        required: true
        type: string
        default: mapa-principal
      place:
        description: Place slug
        required: true
        type: string
        default: main
      environment:
        description: Target mapping
        type: choice
        options:
          - production
          - staging
        required: true
        default: production

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install image renderer
        run: python -m pip install Pillow==11.3.0
      - name: Validate target IDs and inspect without writes
        env:
          GAME_NAME: ${{ inputs.game || 'mapa-principal' }}
          PLACE_NAME: ${{ inputs.place || 'main' }}
          ENV_NAME: ${{ inputs.environment || 'production' }}
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          python tools/deploy.py validate
          python tools/scene_inspector.py --game "$GAME_NAME" --place "$PLACE_NAME" --environment "$ENV_NAME" --execute --output dist/scene-inspector
      - name: Upload structural report, map and JSON
        uses: actions/upload-artifact@v4
        with:
          name: roblox-scene-structure
          path: dist/scene-inspector/
          if-no-files-found: error
          retention-days: 14
