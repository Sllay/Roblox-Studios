name: S08.6 final landmark and foliage polish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s086-final-polish.yml'
      - 'tools/s086_final_polish.py'
      - 'tools/sync/s086_final_polish.luau'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/s086_final_polish.py --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s086-final-polish
          path: dist/s086-polish/
