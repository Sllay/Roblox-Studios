name: S08 Asset Factory P1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/asset_factory/**'
      - '.github/workflows/s08-asset-factory.yml'
permissions:
  contents: read
jobs:
  author:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and software graphics
        run: |
          sudo apt-get update
          sudo apt-get install -y blender xvfb libgl1-mesa-dri
          blender --version
      - name: Author and render
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python3 tools/asset_factory/run.py --job tools/asset_factory/jobs/p1-smoke.json --out dist/asset-factory/p1-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s08-p1-smoke
          path: dist/asset-factory/
          if-no-files-found: warn
