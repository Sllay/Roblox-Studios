name: Creature Factory Next read-only baseline

on:
  pull_request:
    paths:
      - 'tools/creature_factory/next/**'
      - 'tests/test_creature_next_audit.py'
      - 'docs/benchmarks/creature-factory-next/**'
      - '.github/workflows/creature-factory-next.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c0-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python regression suite
        run: |
          python -m pip install Pillow==11.3.0
          python -m unittest discover -s tests -v
      - name: Install CPU Blender and its distribution NumPy
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
      - name: Audit preserved candidates without inference or asset writes
        # setup-python exports its libpython directory. The apt Blender/NumPy
        # pair must use distribution Python, not the toolcache interpreter.
        run: |
          env -u LD_LIBRARY_PATH -u PYTHONHOME -u PYTHONPATH \
            /usr/bin/python3 -m tools.creature_factory.next audit \
            --out dist/creature-next/c0-ci --render --resolution 64 --timeout 180
      - name: Preserve diagnostic outputs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creature-next-c0
          path: dist/creature-next/c0-ci/
          if-no-files-found: warn
