name: S07 modular prop preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/s07-prop-preview.yml', 'tools/prop_framework.py', 'tools/s07_prop_preview.py', 'games/maps/mapa-principal/game/assets/prop-registry-s07.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: python -m unittest discover -s tests -p test_prop_framework.py -v
      - run: bash tools/install-luau.sh
      - name: Plan on verified v18 terrain
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/s07_prop_preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s07-prop-preview
          path: dist/s07/
          if-no-files-found: warn
