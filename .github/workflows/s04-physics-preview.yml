name: S04 collider geometry and wind preview (read only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/s04-physics-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: python -m unittest discover -s tests -v
      - run: bash tools/install-luau.sh
      - run: bash tools/install-luau-lsp.sh
      - run: python tools/script_quality.py
      - run: python tools/quality_gate_v2.py
      - uses: actions/download-artifact@v4
        with:
          name: s04-inventory
          run-id: 43268031007
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/s04
      - run: python tools/physics_builder.py --inventory dist/s04/inventory.json
      - name: Native detached collider and wind proof
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          python tools/physics_preview.py --plan dist/s04/collider-plan.json
          python tools/wind_policy_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s04-physics-preview
          path: dist/s04/
          if-no-files-found: warn
