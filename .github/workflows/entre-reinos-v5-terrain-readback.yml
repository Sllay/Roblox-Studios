name: Entre Reinos v5 independent saved-Place readback (read-only)
on:
  push:
    branches: [main]
    paths: [.github/workflows/entre-reinos-v5-terrain-readback.yml]
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - name: Verify the saved v5 server/GUI diagnostic source with no data mutation
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          PYTHONPATH=tools python - <<'PY'
          import os,json
          from cloud_tasks import run_task
          source = '''
          local H=game:GetService("HttpService")
          local SS=game:GetService("ServerScriptService")
          local RS=game:GetService("ReplicatedStorage")
          local SP=game:GetService("StarterPlayer")
          local sv=SS:FindFirstChild("Services")
          local client=SP:FindFirstChild("StarterPlayerScripts")
          local shared=RS:FindFirstChild("Game")
          local function inspect(parent,name,token)
              local obj=parent and parent:FindFirstChild(name)
              if not obj then return false end
              if not token then return true end
              local ok,sourceText=pcall(function()return obj.Source end)
              return ok and type(sourceText)=="string"
                 and string.find(sourceText,token,1,true)~=nil
          end
          return H:JSONEncode({
            universeId=tostring(game.GameId),placeId=tostring(game.PlaceId),
            version=game.PlaceVersion,checks={
              boot=inspect(SS,"Boot",'WorldService.getFailure()'),
              serverRevision=inspect(SS,"Boot",'serverRevision = game.PlaceVersion'),
              world=inspect(sv,"WorldService",'generationFailure'),
              saves=inspect(sv,"SaveSlotService",'for attempt = 1, 3 do'),
              saveProtection=inspect(sv,"SaveSlotService",'ER_WorldLoaded'),
              menu=inspect(client,"SlotMenu",'response.serverRevision'),
              noMask=inspect(client,"SlotMenu",'recoverCharacter or failure == "transport_failed"'),
              r6=inspect(sv,"CharacterService"),
              slot=inspect(shared,"SlotModel"),
              camera=inspect(client,"SideCamera"),
              lane=inspect(client,"LaneController"),
              startArea=inspect(workspace,"StartArea")
            }
          })
          '''
          result=run_task("10769712413","90623742498445",
                os.environ["ROBLOX_OPEN_CLOUD_API_KEY"],source,read_version=5)
          print("ENTRE_REINOS_V5_SOURCE_READBACK",json.dumps({
              "version":result["loadedVersion"],"checks":result["checks"]
          },sort_keys=True))
          assert result["loadedVersion"]==5, "Incorrect published Place revision"
          assert all(result["checks"].values()), "One or more expected v5 features missing"
          print("ENTRE_REINOS_V5_READBACK_PASS")
          PY
