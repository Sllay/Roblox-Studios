name: S09 Chicken native detached proof
on:
  push:
    branches: [main]
    paths:
      - 'tools/creature_factory/chicken_native.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s09-chicken-native
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: bash tools/install-luau.sh
      - run: |
          git config user.name "asset-factory[bot]"
          git config user.email "asset-factory[bot]@users.noreply.github.com"
      - env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/creature_factory/chicken_native.py
