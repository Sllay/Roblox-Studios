name: S08 Approved Asset Intake
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/asset_factory/approved/*.glb'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved models
        run: python3 tools/asset_factory/validate_approved.py
      - uses: actions/upload-artifact@v4
        with:
          name: approved-v6
          path: tools/asset_factory/approved/
          if-no-files-found: error
