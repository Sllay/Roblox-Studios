name: Scene Patch (incremental staging)
on:
  workflow_dispatch:
    inputs:
      game:
        type: string
        default: mapa-principal
      place:
        type: string
        default: main
      plan:
        type: string
        required: true
      operation:
        type: choice
        options: [preview, apply]
        default: preview
      confirm_staging:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: roblox-place-write-${{ inputs.game }}-${{ inputs.place }}-staging
  cancel-in-progress: false
jobs:
  patch:
    if: ${{ github.ref == 'refs/heads/main' && (inputs.operation == 'preview' || inputs.confirm_staging) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - run: python -m unittest discover -s tests -v
      - run: python tools/script_quality.py
      - name: Preview or apply exact scene patch
        env:
          GAME: ${{ inputs.game }}
          PLACE: ${{ inputs.place }}
          PLAN: ${{ inputs.plan }}
          OP: ${{ inputs.operation }}
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          [[ "$GAME" =~ ^[a-z0-9-]+$ && "$PLACE" =~ ^[a-z0-9-]+$ && "$PLAN" =~ ^[a-z0-9-]+\.json$ ]] || exit 1
          args=()
          if [[ "$OP" == apply ]]; then args+=(--confirm-staging); fi
          python tools/scene_patch.py "$OP" --game "$GAME" --place "$PLACE" --plan "games/maps/$GAME/docs/sync/$PLACE/patches/$PLAN" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scene-patch-evidence
          path: dist/scene-patch/
          if-no-files-found: warn
