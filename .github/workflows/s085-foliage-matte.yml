name: S08.5 matte foliage staging
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s085-foliage-matte.yml'
      - 'tools/s085_foliage_matte.py'
      - 'tools/sync/s085_foliage_matte.luau'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - name: Matte material native preview and guarded publication
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/s085_foliage_matte.py --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s085-foliage-matte
          path: dist/s085/
