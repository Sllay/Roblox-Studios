name: S09.10 Rabbit staged runtime source validation
on:
  push:
    branches: [feat/creature-factory-next]
    paths:
      - '.github/workflows/s0910-rabbit-runtime-ci.yml'
      - 'games/maps/mapa-principal/game/places/main/src/ServerScriptService/CreatureFramework/**'
      - 'games/maps/mapa-principal/game/places/main/src/ServerScriptService/CreatureBootstrap.server.luau'
      - 'games/maps/mapa-principal/game/places/main/src/StarterPlayer/StarterPlayerScripts/CreatureVisual.client.luau'
      - 'tests/luau/creature_framework.luau'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.11.0.86 scipy==1.13.1 scikit-image==0.24.0 trimesh==4.6.8 rtree==1.3.0 fast-simplification==0.1.11 jsonschema==4.23.0
      - run: bash tools/install-luau.sh
      - run: bash tools/install-luau-lsp.sh
      - name: Repository Python / Lua quality and unit tests
        run: |
          python tools/script_quality.py
          python -m unittest discover -s tests -v
          luau tests/luau/creature_framework.luau
          luau tests/luau/rabbit_runtime.luau
      - name: Native Luau static analysis of multi-species runtime
        run: |
          base=games/maps/mapa-principal/game/places/main/src/ServerScriptService
          for f in "$base"/CreatureFramework/*.luau; do
            luau-lsp analyze --definitions="$RS_ROBLOX_DEFINITIONS" "$f"
          done
          # Bootstrap uses dynamic module require; luau-lsp without sourcemaps cannot resolve it.
          # Full syntax compilation remains enforced by script_quality.py; the native preview loads it.
          luau-lsp analyze --definitions="$RS_ROBLOX_DEFINITIONS" games/maps/mapa-principal/game/places/main/src/StarterPlayer/StarterPlayerScripts/CreatureVisual.client.luau
