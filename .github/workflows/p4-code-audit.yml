name: P4 detached source audit (read only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/p4-code-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  audit:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - name: Compile detached source without executing
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/assets/code_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-code-audit
          path: dist/p4-code-audit/
          if-no-files-found: warn
