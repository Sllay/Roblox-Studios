name: S06.7 read-only v18 reconciliation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/s06-resource-contact-reconcile.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - uses: actions/download-artifact@v4
        with:
          name: s067-resource-publication
          run-id: 43313272825
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/s067-recovery
      - name: Verify existing published version without writing Roblox
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/resource_contact_reconcile.py --artifact dist/s067-recovery
      - name: Commit reconciled state
        run: |
          git config user.name "roblox-scene-sync[bot]"
          git config user.email "scene-sync@users.noreply.github.com"
          git add games/maps/mapa-principal/docs/s06/resource-contact-publish-v18 games/maps/mapa-principal/docs/sync/main/staging.json games/maps/mapa-principal/docs/sync/main/staging.summary.json
          git commit -m "sync: reconcile verified v18 without republishing Roblox"
          git push origin HEAD:main
