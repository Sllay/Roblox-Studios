name: S08 UV and Paint Smoke
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/s08-uv-paint-smoke.yml'
      - 'tools/asset_factory/uv_author.py'
      - 'tools/asset_factory/ingest_png.py'
      - 'tools/asset_factory/bind_paint.py'
      - 'tools/asset_factory/paint_smoke.py'
      - 'tools/asset_factory/uv_audit.py'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y blender python3-pil python3-numpy
      - name: Verify Blender dependencies
        run: blender -b --python-exit-code 1 --python-expr 'import numpy; print(numpy.__version__)'
      - name: Test UV on disposable geometry
        run: |
          blender -b --factory-startup --python-exit-code 1 --python-expr 'import bpy; bpy.ops.wm.read_factory_settings(use_empty=True); bpy.ops.mesh.primitive_cube_add(); bpy.context.object.data.materials.append(bpy.data.materials.new("PaintFixture")); bpy.ops.mesh.primitive_cube_add(location=(3,0,0)); bpy.context.object.data.materials.append(bpy.data.materials["PaintFixture"]); bpy.ops.export_scene.gltf(filepath="/tmp/uv-fixture.glb",export_format="GLB")'
          blender -b --factory-startup --python-exit-code 1 --python tools/asset_factory/uv_author.py -- /tmp/uv-fixture.glb /tmp/uv-smoke
      - name: Audit UV overlap and distortion
        run: |
          blender -b --factory-startup --python-exit-code 1 --python tools/asset_factory/uv_audit.py -- /tmp/uv-smoke/asset.glb /tmp/uv-smoke/audit.json --shared
          blender -b --factory-startup --python-exit-code 1 --python tools/asset_factory/uv_audit.py -- asset-library/approved/axe/v6/machado-v6.glb /tmp/uv-smoke/axe-v6-audit.json
      - name: Verify original artistic PNG intake
        run: |
          mkdir -p asset-library/inbox
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('tools/asset_factory/approved/Black-Islands-Assets-A1.zip') as z:
              names=[n for n in z.namelist() if n.lower().endswith('.png')]
              assert names
              Path('asset-library/inbox/smoke.png').write_bytes(z.read(names[0]))
          PY
          python3 tools/asset_factory/ingest_png.py asset-library/inbox/smoke.png smoke v1
          cmp asset-library/inbox/smoke.png asset-library/paint-inputs/smoke/v1/color.png
      - name: Bind exact PNG to fixture UV
        run: |
          blender -b --factory-startup --python-exit-code 1 --python tools/asset_factory/paint_smoke.py -- /tmp/uv-smoke/asset.glb asset-library/paint-inputs/smoke/v1/color.png /tmp/paint-contract.json
          blender -b --factory-startup --python-exit-code 1 --python tools/asset_factory/bind_paint.py -- /tmp/uv-smoke/asset.glb asset-library/paint-inputs/smoke/v1/color.png /tmp/paint-contract.json /tmp/paint-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: uv-paint-smoke
          path: |
            /tmp/uv-smoke/
            /tmp/paint-smoke/
            asset-library/paint-inputs/smoke/
