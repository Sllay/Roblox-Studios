name: S09.9 native V31 preview
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/s09_v31_release.py'
      - 'tools/sync/s09_v31_release.luau'
      - '.github/workflows/s09-v31-preview.yml'
      - 'games/maps/mapa-principal/game/places/main/src/**'
permissions:
  contents: read
jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/s09_v31_release.py --preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s09-v31-preview
          path: dist/s09-v31/
