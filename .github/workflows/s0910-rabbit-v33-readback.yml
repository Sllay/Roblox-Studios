name: S09.10 Rabbit V33 - read-only place reconciliation
on:
  push:
    branches: [feat/creature-factory-next]
    paths:
      - '.github/workflows/s0910-rabbit-v33-readback.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install official native compiler
        run: |
          python -m pip install Pillow==11.3.0
          bash tools/install-luau.sh
      - name: Validate unchanged script scope
        run: |
          python tools/script_quality.py
          python -m unittest discover -s tests -p 'test_rabbit_animation_v2.py' -v
          luau tests/luau/rabbit_runtime.luau
      - name: Configure durable evidence author
        run: |
          git config user.name 'roblox-scene-sync[bot]'
          git config user.email 'scene-sync@users.noreply.github.com'
      - name: Read-only version and exact V33 source, animation and terrain verification
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/s0910_rabbit_v33_readback.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s0910-rabbit-v33-readback-evidence
          path: games/maps/mapa-principal/docs/s09/publication-rabbit-v33.json
          if-no-files-found: warn
