name: Entre Reinos v9 published NPC feet and R6 water engine probe (unsaved)
on:
  push:
    branches: [main]
    paths: [.github/workflows/entre-reinos-v9-npc-water-engine-readback.yml]
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - name: Read v9 Place, generate native Terrain and verify R6 feet above actual surface
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          PYTHONPATH=tools python - <<'PY'
          import os,json
          from cloud_tasks import run_task
          lua='''
          local H=game:GetService("HttpService")
          local P=game:GetService("Players")
          local SP=game:GetService("StarterPlayer")
          local S=game:GetService("ServerScriptService")
          local R=game:GetService("ReplicatedStorage")
          local gameFolder=R:FindFirstChild("Game")
          local services=S:FindFirstChild("Services")
          local client=SP:FindFirstChild("StarterPlayerScripts")
          local function source(parent,name,needle)
              local scriptObj=parent and parent:FindFirstChild(name)
              if not scriptObj then return false end
              if not needle then return true end
              local ok,s=pcall(function() return scriptObj.Source end)
              return ok and type(s)=="string" and string.find(s,needle,1,true)~=nil
          end
          local checks={
              npcFeet=source(services,"LivingService","local function pivotToFoot(model: Model)"),
              actualGround=source(services,"LivingService","groundCast.FilterDescendantsInstances={workspace.Terrain}"),
              noServerJitter=source(services,"LivingService",'model:SetAttribute("ER_NPCPose",target)'),
              stockNPCWalk=source(client,"NPCPresentation","rbxassetid://180426354"),
              clientRenderInterpolation=source(client,"NPCPresentation",'BindToRenderStep("ER_NPCPresentation"'),
              wiredNPC=source(client,"ClientBoot","NPCPresentation.start()"),
              labelsNoBackground=source(services,"LivingService","caption.BackgroundTransparency=1"),
              labelsStroke=source(services,"LivingService","caption.TextStrokeTransparency=0.08"),
              shortLabels=source(services,"LivingService","bill.MaxDistance=40"),
              swimDetection=source(client,"LaneController","Water.submerged(currentSeed,"),
              swimState=source(client,"LaneController","ChangeState(Enum.HumanoidStateType.Swimming)"),
              swimVisual=source(client,"R6SwimVisual","RunService.PreSimulation:Connect("),
              waterRules=source(gameFolder,"WaterRules","function Water.submerged("),
              darkTrees=source(services,"WorldService","DarkTreeSilhouette_"),
              cameraZoom=source(client,"SideCamera","desiredDistance = if wide then 118 else 88"),
              stockJump=source(client,"LaneController","controls:GetMoveVector()"),
          }
          local probe={terrain=false,avatar=false,wet=false,dry=false,
              footError=1000,feetOffset=0,chunkCount=0,waterCells=0,issue=""}
          local ok,reason=pcall(function()
              local W=require(services:WaitForChild("WorldService"))
              local Rules=require(gameFolder:WaitForChild("WaterRules"))
              local seed=516639272
              local done,why=W.activate(seed)
              assert(done,tostring(why))
              probe.terrain=true
              probe.chunkCount=W.getChunkCount()
              probe.waterCells=tonumber(workspace:GetAttribute("ER_WorldWaterCells")) or 0
              probe.wet=Rules.submerged(seed,76,9,0)
              probe.dry=not Rules.submerged(seed,-50,9,0)
              local desc=Instance.new("HumanoidDescription")
              local avatar=P:CreateHumanoidModelFromDescriptionAsync(desc,Enum.HumanoidRigType.R6)
              desc:Destroy()
              avatar.Parent=workspace
              local h=avatar:FindFirstChildOfClass("Humanoid")
              assert(h and h.RigType==Enum.HumanoidRigType.R6)
              local pivot=avatar:GetPivot().Position.Y
              local bottom=math.huge
              for _,name in ipairs({"Left Leg","Right Leg"}) do
                  local leg=avatar:FindFirstChild(name)
                  if leg and leg:IsA("BasePart") then
                      bottom=math.min(bottom,leg.Position.Y-leg.Size.Y*0.5)
                  end
              end
              assert(bottom<math.huge)
              local offset=math.clamp(pivot-bottom,1.8,7)
              probe.feetOffset=offset
              local rc=RaycastParams.new()
              rc.FilterType=Enum.RaycastFilterType.Include
              rc.FilterDescendantsInstances={workspace.Terrain}
              rc.IgnoreWater=true
              local hit=workspace:Raycast(Vector3.new(4,70,-2),Vector3.new(0,-120,0),rc)
              assert(hit and hit.Instance==workspace.Terrain)
              local position=Vector3.new(4,hit.Position.Y+offset+0.14,-2)
              avatar:PivotTo(CFrame.new(position))
              local finalBottom=math.huge
              for _,name in ipairs({"Left Leg","Right Leg"}) do
                  local leg=avatar:FindFirstChild(name)
                  finalBottom=math.min(finalBottom,leg.Position.Y-leg.Size.Y*0.5)
              end
              probe.footError=math.abs(finalBottom-hit.Position.Y)
              probe.avatar=probe.footError<0.35
              avatar:Destroy()
          end)
          if not ok then probe.issue=tostring(reason):sub(1,500) end
          return H:JSONEncode({
              placeId=tostring(game.PlaceId),universeId=tostring(game.GameId),
              revision=game.PlaceVersion,checks=checks,probe=probe,
          })
          '''
          r=run_task("10769712413","90623742498445",
              os.environ["ROBLOX_OPEN_CLOUD_API_KEY"],lua,read_version=9)
          print("ENTRE_REINOS_V9_R6_ENGINE_READBACK",json.dumps({
              "loadedVersion":r["loadedVersion"],"checks":r["checks"],
              "probe":r["probe"]
          },sort_keys=True))
          assert r["loadedVersion"]==9
          assert all(r["checks"].values()),"Missing new v9 module/source in published Place"
          p=r["probe"]
          assert p["terrain"] and p["avatar"] and p["wet"] and p["dry"],p["issue"]
          assert p["chunkCount"]==3 and p["waterCells"]>0
          assert p["footError"]<0.35,p["footError"]
          print("ENTRE_REINOS_V9_R6_ENGINE_READBACK_PASS")
          PY
