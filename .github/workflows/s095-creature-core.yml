name: S09.5 Creature framework core
on:
  push:
    paths:
      - 'games/maps/mapa-principal/game/places/main/src/ServerScriptService/CreatureFramework/**'
      - 'tests/luau/creature_framework.luau'
      - 'games/maps/mapa-principal/game/places/main/src/StarterPlayer/StarterPlayerScripts/BookView.luau'
      - 'games/maps/mapa-principal/game/places/main/src/StarterPlayer/StarterPlayerScripts/RSCrosshair.client.luau'
      - 'games/maps/mapa-principal/game/places/main/src/StarterPlayer/StarterPlayerScripts/RSBook.client.luau'
      - '.github/workflows/s095-creature-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/install-luau.sh
      - run: bash tools/install-luau-lsp.sh
      - name: Compile and execute core contracts
        run: |
          for f in games/maps/mapa-principal/game/places/main/src/ServerScriptService/CreatureFramework/*.luau; do luau-compile --null "$f"; luau-lsp analyze --definitions="$RS_ROBLOX_DEFINITIONS" "$f"; done
          for f in BookView.luau RSCrosshair.client.luau RSBook.client.luau; do luau-lsp analyze --definitions="$RS_ROBLOX_DEFINITIONS" "games/maps/mapa-principal/game/places/main/src/StarterPlayer/StarterPlayerScripts/$f"; done
          luau tests/luau/creature_framework.luau
