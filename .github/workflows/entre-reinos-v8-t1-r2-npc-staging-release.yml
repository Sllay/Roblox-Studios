name: Entre Reinos v8 T1-R2 NPC and building staging preview (one-shot)
on:
  push:
    branches: [main]
    paths: [.github/workflows/entre-reinos-v8-t1-r2-npc-staging-release.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: roblox-place-write-entre-reinos-main-staging
  cancel-in-progress: false
jobs:
  preview:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - name: Verify exact staging destination, real R2 source and CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          game=Path('games/maps/entre-reinos')
          t=json.loads((game/'deploy.targets.json').read_text())['environments']
          assert str(t['staging']['universeId'])=='10769712413'
          assert str(t['staging']['placeIds']['main'])=='90623742498445'
          assert t['production']['universeId'] is None
          assert t['production']['placeIds']['main'] is None
          manifest=json.loads((game/'game.manifest.json').read_text())
          assert manifest['places'][0]['fullPlaceBuildAuthoritative'] is True
          root=game/'game/places/main/src'
          boot=(root/'ServerScriptService/Boot.server.luau').read_text()
          char=(root/'ServerScriptService/Services/CharacterService.luau').read_text()
          saves=(root/'ServerScriptService/Services/SaveSlotService.luau').read_text()
          live=(root/'ServerScriptService/Services/LivingService.luau').read_text()
          work=(root/'ReplicatedStorage/Living/WorkEngine.luau').read_text()
          ui=(root/'StarterPlayer/StarterPlayerScripts/BuildMenu.luau').read_text()
          assert 'pcall(LivingService.start,' in boot
          assert 'Saves.setLivingProvider(' in boot
          assert 'animateSource:Clone()' in char
          assert 's.data.living = LivingModel.clone(state)' in saves
          assert 'Work.step(state,0.1)' in live
          assert 'Work.place(state,typeId,x)' in live
          assert 'site.remaining-=n' in work
          assert 'Inventory.take(npc.inventory,item,n)' in work
          assert 'remote:InvokeServer(action,arg)' in ui
          status=json.loads((game/'docs/RUNNER_STATUS.json').read_text())
          assert status['seasons'][0]['runners'][0]['status']=='validated'
          assert status['seasons'][0]['runners'][1]['status']=='in_progress'
          assert status['seasons'][0]['runners'][2]['status']=='planned'
          print('ER_T1_R2_PREVIEW_SOURCE_AND_STATUS_PASS')
          PY
          result="$(gh api repos/Sllay/Roblox-Studios/actions/runs/45033200114 --jq .conclusion)"
          [[ "$result" == success ]] || { echo "::error::R2 integrated code CI not green"; exit 1; }
      - name: Read existing published v7 inventory without modifying game
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          python tools/scene_sync.py --game entre-reinos --place main --environment staging --expected-version 7 --record
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('games/maps/entre-reinos/docs/sync/main/staging.summary.json')
          s=json.loads(p.read_text())
          assert s['loadedVersion']==7
          assert str(s['universeId'])=='10769712413'
          assert str(s['placeId'])=='90623742498445'
          assert s['total']>=70
          roots={r['name'] for r in s['workspaceRoots']}
          assert 'StartArea' in roots and 'Baseplate' not in roots
          print('ER_PREVIEW_V7_BASELINE_PASS',s['stateDigest'])
          PY
      - name: Commit observed baseline without force
        run: |
          git config user.name "entre-reinos-r2-preview[bot]"
          git config user.email "entre-reinos-r2-preview@users.noreply.github.com"
          git add -- games/maps/entre-reinos/docs/sync/main/staging.json games/maps/entre-reinos/docs/sync/main/staging.summary.json
          if ! git diff --cached --quiet; then
            git commit -m "sync(entre-reinos): record verified v7 before T1-R2 preview"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Dispatch official staging-only Roblox Place publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="$(gh api repos/Sllay/Roblox-Studios/git/ref/heads/main --jq .object.sha)"
          current="$(git rev-parse HEAD)"
          [[ "$remote" == "$current" ]] || { echo "::error::main advanced; refusing stale publish"; exit 1; }
          gh api -X POST repos/Sllay/Roblox-Studios/actions/workflows/publish.yml/dispatches --input - <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "game": "entre-reinos",
              "place": "main",
              "environment": "staging",
              "confirm_publish": "true",
              "confirm_full_place_replacement": "true"
            }
          }
          JSON
          echo "ER_T1_R2_STAGING_PREVIEW_PUBLISH_DISPATCHED"
