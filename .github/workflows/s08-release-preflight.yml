name: S08 Release Preflight
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/s08-release-preflight.yml'
      - 'tools/asset_factory/register_v6.py'
permissions:
  contents: write
concurrency:
  group: s08-release-preflight
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: |
          python3 tools/asset_factory/register_v6.py
          for asset in sword axe pickaxe; do
            python3 tools/asset_factory/roblox_import.py "asset-library/approved/$asset/v6" --receipt "/tmp/$asset.json"
          done
      - run: |
          git config user.name "asset-factory[bot]"
          git config user.email "asset-factory[bot]@users.noreply.github.com"
          git add asset-library/approved
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets: register verified V6 releases"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
