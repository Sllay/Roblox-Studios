name: S08.4 existing canopy split capability
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s084-foliage-split.yml'
      - 'tools/s084_foliage_split_probe.py'
      - 'tools/sync/s084_foliage_split_probe.luau'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/s084_foliage_split_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s084-foliage-split
          path: dist/s084-split/
