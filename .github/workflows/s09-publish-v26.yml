name: S09.5 publish creatures to staging
on:
  push:
    branches: [main]
    paths:
      - 'games/maps/mapa-principal/docs/s09/publish-v26.trigger'
permissions:
  contents: write
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - run: bash tools/install-luau-lsp.sh
      - run: python tools/script_quality.py
      - run: python -m unittest discover -s tests -v
      - run: luau tests/luau/creature_framework.luau
      - run: |
          git config user.name "roblox-scene-sync[bot]"
          git config user.email "scene-sync@users.noreply.github.com"
      - env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/s09_release.py --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s09-v26-release
          path: dist/s09-release/
