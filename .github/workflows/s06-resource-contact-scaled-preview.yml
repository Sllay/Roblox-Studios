name: S06.7 measured support with doubled sticks v2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/s06-resource-contact-scaled-preview.yml', 'tools/sync/resource_contact_scaled_preview.luau', 'tools/resource_contact_scaled_preview.py']
permissions:
  contents: write
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - run: python tools/resource_contact_scaled_preview.py --output dist/s067-scaled
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
      - name: Preserve correction preview
        run: |
          mkdir -p games/maps/mapa-principal/docs/s06/resource-contact-scaled-v17
          cp dist/s067-scaled/*.json games/maps/mapa-principal/docs/s06/resource-contact-scaled-v17/
          git config user.name "roblox-scene-sync[bot]"
          git config user.email "scene-sync@users.noreply.github.com"
          git add games/maps/mapa-principal/docs/s06/resource-contact-scaled-v17
          git commit -m "evidence(s06.7): measured support and doubled stick preview"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s067-contact-scaled-preview
          path: dist/s067-scaled/
          if-no-files-found: warn
