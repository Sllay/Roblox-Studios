name: S06.4 vertex API enabled retest
on:
  push:
    branches: [main]
    paths: ['games/maps/mapa-principal/docs/s06-4-vertex-enabled.trigger']
permissions:
  contents: write
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - name: Probe owned original and existing foliage
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          python tools/owned_canopy_vertex_probe.py --output dist/s06-4-enabled
          python tools/canopy_capability_probe.py --output dist/s06-4-enabled
      - name: Persist proof
        if: always()
        run: |
          mkdir -p games/maps/mapa-principal/docs/s06/wind-v16/vertex-enabled
          if compgen -G 'dist/s06-4-enabled/*.json' >/dev/null; then
            cp dist/s06-4-enabled/*.json games/maps/mapa-principal/docs/s06/wind-v16/vertex-enabled/
            git config user.name "roblox-scene-sync[bot]"
            git config user.email "scene-sync@users.noreply.github.com"
            git add games/maps/mapa-principal/docs/s06/wind-v16/vertex-enabled
            git commit -m "evidence(s06.4): record enabled vertex API probe"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s06-4-vertex-enabled
          path: dist/s06-4-enabled/
          if-no-files-found: warn
