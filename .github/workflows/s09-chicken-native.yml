name: S09 Chicken detached Roblox proof
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s09-chicken-native.yml'
      - 'tools/creature_factory/chicken_native.py'
      - 'tools/sync/s09_chicken_native.luau'
permissions:
  contents: write
concurrency:
  group: s09-chicken-native
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - run: |
          git config user.name "asset-factory[bot]"
          git config user.email "asset-factory[bot]@users.noreply.github.com"
      - name: One-shot original model upload and detached proof
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/creature_factory/chicken_native.py
