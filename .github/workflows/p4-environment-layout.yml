name: P4 environment layout (staging)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/p4-environment-layout.yml']
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [preview, apply]
        default: preview
      reviewed:
        type: string
        default: p4-environment-layout-v10.json
      confirm_staging:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  layout:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.operation == 'preview' || inputs.confirm_staging) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - run: python tools/script_quality.py
      - name: Preview or apply reviewed layout
        env:
          OP: ${{ inputs.operation || 'preview' }}
          REVIEWED: ${{ inputs.reviewed || 'p4-environment-layout-v10.json' }}
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          if [[ "$OP" == apply ]]; then
            [[ "$REVIEWED" =~ ^[a-z0-9-]+\.json$ ]] || exit 1
            python tools/environment_layout.py apply --reviewed "games/maps/mapa-principal/docs/sync/main/patches/$REVIEWED" --confirm-staging
          else
            python tools/environment_layout.py preview
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-environment-layout
          path: dist/p4-layout/
          if-no-files-found: warn
