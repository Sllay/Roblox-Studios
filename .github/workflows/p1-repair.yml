name: P1 placement and lighting lab (staging)
on:
  workflow_dispatch:
    inputs:
      confirm:
        type: boolean
        default: false
  push:
    paths: ['games/maps/mapa-principal/docs/p1-repair-once.trigger']
permissions:
  contents: read
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  repair:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirm) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - run: python -m unittest discover -s tests -v
      - run: python tools/script_quality.py
      - name: Repair and independently verify staging
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/assets/p1_repair.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-repair-evidence
          path: dist/p1-repair/
          if-no-files-found: warn
