name: S09 Chicken API diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/creature_factory/chicken_api_diagnostics.py'
permissions:
  contents: write
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          git config user.name "asset-factory[bot]"
          git config user.email "asset-factory[bot]@users.noreply.github.com"
      - env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/creature_factory/chicken_api_diagnostics.py
