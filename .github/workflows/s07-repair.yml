name: S07 repair population
on:
  push:
    branches: [main]
    paths: ['.github/workflows/s07-repair.yml','tools/s07_population_repair.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - uses: actions/download-artifact@v4
        with:
          name: s07-prop-preview
          run-id: 43316861614
          github-token: ${{ github.token }}
          path: dist/s07/
      - uses: actions/download-artifact@v4
        with:
          pattern: s07-population-*
          run-id: 43319684053
          github-token: ${{ github.token }}
          merge-multiple: true
          path: dist/s07/
      - name: Repair rejected native positions
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/s07_population_repair.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s07-repaired-population
          path: dist/s07/repaired-population.json
