name: Entre Reinos initial staging baseline (Roblox read-only)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/entre-reinos-baseline.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roblox-place-write-entre-reinos-main-staging
  cancel-in-progress: false

jobs:
  baseline:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install read-only inventory dependencies
        run: python -m pip install Pillow==11.3.0
      - name: Capture exact published Place baseline, no save to Roblox
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: >
          python tools/scene_sync.py
          --game entre-reinos --place main --environment staging
          --expected-version 1 --record
      - name: Commit observed inventory with non-force push
        run: |
          git config user.name "entre-reinos-scene-sync[bot]"
          git config user.email "entre-reinos-scene-sync@users.noreply.github.com"
          git add --             games/maps/entre-reinos/docs/sync/main/staging.json             games/maps/entre-reinos/docs/sync/main/staging.summary.json
          if ! git diff --cached --quiet; then
            git commit -m "sync(entre-reinos): record verified initial staging v1"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: entre-reinos-staging-inventory
          path: dist/scene-sync/
          if-no-files-found: warn
