name: S09 Chicken native animation pilot
on:
  push:
    branches: [main]
    paths:
      - 'tools/creature_factory/chicken_animation_native.py'
      - 'tools/sync/s09_chicken_animation_probe.luau'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s09-chicken-animation
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0 numpy==2.2.6 scipy==1.15.3
      - run: bash tools/install-luau.sh
      - run: |
          git config user.name "asset-factory[bot]"
          git config user.email "asset-factory[bot]@users.noreply.github.com"
      - env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/creature_factory/chicken_animation_native.py
