name: Entre Reinos R6 hotfix live Place readback (read-only)
on:
  push:
    branches: [main]
    paths: [.github/workflows/entre-reinos-r6-hotfix-readback.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - name: Confirm published version 3 includes real R6 character service
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          PYTHONPATH=tools python - <<'PY'
          import json, os
          from cloud_tasks import run_task
          source = '''
          local H=game:GetService("HttpService")
          local SS=game:GetService("ServerScriptService")
          local RS=game:GetService("ReplicatedStorage")
          local SP=game:GetService("StarterPlayer")
          local services=SS:FindFirstChild("Services")
          local g=RS:FindFirstChild("Game")
          local scripts=SP:FindFirstChild("StarterPlayerScripts")
          local function present(parent,name,class)
              local node=parent and parent:FindFirstChild(name)
              return node~=nil and node.ClassName==class
          end
          return H:JSONEncode({
              universeId=tostring(game.GameId),placeId=tostring(game.PlaceId),
              placeVersion=game.PlaceVersion,
              files={
                boot=present(SS,"Boot","Script"),
                characterService=present(services,"CharacterService","ModuleScript"),
                world=present(services,"WorldService","ModuleScript"),
                saves=present(services,"SaveSlotService","ModuleScript"),
                profile=present(g,"WorldProfile","ModuleScript"),
                slots=present(g,"SlotModel","ModuleScript"),
                lease=present(g,"SlotLeasePolicy","ModuleScript"),
                camera=present(scripts,"SideCamera","ModuleScript"),
                lane=present(scripts,"LaneController","ModuleScript"),
                ui=present(scripts,"SlotMenu","ModuleScript"),
                client=present(scripts,"ClientBoot","LocalScript")
              }
          })
          '''
          result=run_task("10769712413","90623742498445",
                          os.environ["ROBLOX_OPEN_CLOUD_API_KEY"],source)
          print("ENTRE_REINOS_R6_HOTFIX_READBACK",json.dumps({
              "version":result["loadedVersion"],"files":result["files"]},sort_keys=True))
          assert result["loadedVersion"]==3,"Place revision differs from verified R6 release"
          assert all(result["files"].values()),"Missing hotfix script(s) in saved Roblox Place"
          print("ENTRE_REINOS_R6_HOTFIX_READBACK_PASS")
          PY
