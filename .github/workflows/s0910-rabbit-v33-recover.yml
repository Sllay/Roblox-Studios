name: S09.10 Rabbit V33 - guarded HTTP429 recovery
on:
  push:
    branches: [feat/creature-factory-next]
    paths:
      - '.github/workflows/s0910-rabbit-v33-recover.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned quality tools
        run: |
          python -m pip install Pillow==11.3.0
          bash tools/install-luau.sh
          bash tools/install-luau-lsp.sh
      - name: Syntax, animation and native-independent AI validation
        run: |
          python tools/script_quality.py
          python -m unittest discover -s tests -p 'test_rabbit_animation_v2.py' -v
          luau tests/luau/rabbit_runtime.luau
          root=games/maps/mapa-principal/game/places/main/src/ServerScriptService/CreatureFramework
          luau-lsp analyze --definitions="$RS_ROBLOX_DEFINITIONS" "$root/CreatureRegistry.luau" "$root/RobloxMobAdapter.luau"
      - name: Configure durable journal author
        run: |
          git config user.name 'roblox-scene-sync[bot]'
          git config user.email 'scene-sync@users.noreply.github.com'
      - name: Reconcile existing V33 receipt and retry at most once
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/s0910_rabbit_v33_recover.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s0910-rabbit-v33-recovery-evidence
          path: |
            dist/s0910-rabbit-v33-stage/
            games/maps/mapa-principal/docs/s09/publication-rabbit-v33.json
          if-no-files-found: warn
