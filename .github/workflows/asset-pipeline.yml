name: Asset audit and safe staging import
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [audit, apply]
        default: audit
        required: true
      game:
        type: string
        default: mapa-principal
        required: true
      place:
        type: string
        default: main
        required: true
      environment:
        type: choice
        options: [production, staging]
        default: production
        required: true
      asset_id:
        type: string
        description: Asset ID (audit only)
        required: false
      plan:
        type: string
        description: Plan filename under game/assets/imports (apply only)
        required: false
      confirm_staging:
        type: boolean
        description: I approve the reviewed staging-only import
        default: false
  push:
    paths: ['games/maps/mapa-principal/docs/asset-audit-once.trigger']
permissions:
  contents: read
concurrency:
  group: roblox-place-write-${{ inputs.game || 'mapa-principal' }}-${{ inputs.place || 'main' }}-${{ inputs.environment || 'production' }}
  cancel-in-progress: false
jobs:
  audit:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.operation == 'audit') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - name: Audit detached asset, no SavePlaceAsync
        env:
          GAME: ${{ inputs.game || 'mapa-principal' }}
          PLACE: ${{ inputs.place || 'main' }}
          TARGET_ENV: ${{ inputs.environment || 'production' }}
          ASSET: ${{ inputs.asset_id || '257489726' }}
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/assets/pipeline.py audit --game "$GAME" --place "$PLACE" --environment "$TARGET_ENV" --asset-id "$ASSET"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asset-audit
          path: dist/asset-pipeline/
          if-no-files-found: warn
  apply:
    if: ${{ github.ref == 'refs/heads/main' && inputs.operation == 'apply' && inputs.environment == 'staging' && inputs.confirm_staging }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - run: python -m unittest discover -s tests -v
      - run: python tools/script_quality.py
      - name: Validate reviewed plan and import only to staging
        env:
          GAME: ${{ inputs.game }}
          PLACE: ${{ inputs.place }}
          PLAN: ${{ inputs.plan }}
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          [[ "$GAME" =~ ^[a-z][a-z0-9-]*$ && "$PLAN" =~ ^[a-z][a-z0-9-]*\.json$ ]] || exit 1
          python tools/assets/pipeline.py apply --game "$GAME" --place "$PLACE" --environment staging --plan "games/maps/$GAME/game/assets/imports/$PLAN" --confirm-staging
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: import-evidence
          path: dist/asset-pipeline/
          if-no-files-found: warn
