name: Entre Reinos v4 recovery readback (read-only, no Place mutation)
on:
  push:
    branches: [main]
    paths: [.github/workflows/entre-reinos-session-recovery-readback.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - name: Independently verify Roblox version 4 contains recovery server/client modules
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          PYTHONPATH=tools python - <<'PY'
          import json,os
          from cloud_tasks import run_task
          source = '''
          local H=game:GetService("HttpService")
          local S=game:GetService("ServerScriptService")
          local R=game:GetService("ReplicatedStorage")
          local P=game:GetService("StarterPlayer")
          local services=S:FindFirstChild("Services")
          local shared=R:FindFirstChild("Game")
          local client=P:FindFirstChild("StarterPlayerScripts")
          local boot=S:FindFirstChild("Boot")
          local menu=client and client:FindFirstChild("SlotMenu")
          local function exists(parent,name,kind)
              local obj=parent and parent:FindFirstChild(name)
              return obj~=nil and obj.ClassName==kind
          end
          local sourceOk=false
          local sourceAvailable=false
          local clientRecovery=false
          if boot then
              local ok,scriptText=pcall(function()return boot.Source end)
              if ok and type(scriptText)=="string" then
                  sourceAvailable=true
                  sourceOk=string.find(scriptText,'action == "resume"',1,true)~=nil
              end
          end
          if menu then
              local ok,scriptText=pcall(function()return menu.Source end)
              if ok and type(scriptText)=="string" then
                  clientRecovery=string.find(scriptText,'request("resume", index)',1,true)~=nil
              end
          end
          return H:JSONEncode({
              universeId=tostring(game.GameId),placeId=tostring(game.PlaceId),placeVersion=game.PlaceVersion,
              nodes={
                  boot=exists(S,"Boot","Script"),
                  terrain=exists(services,"WorldService","ModuleScript"),
                  saves=exists(services,"SaveSlotService","ModuleScript"),
                  r6=exists(services,"CharacterService","ModuleScript"),
                  slotModel=exists(shared,"SlotModel","ModuleScript"),
                  profile=exists(shared,"WorldProfile","ModuleScript"),
                  menu=exists(client,"SlotMenu","ModuleScript"),
                  client=exists(client,"ClientBoot","LocalScript"),
                  camera=exists(client,"SideCamera","ModuleScript"),
                  lane=exists(client,"LaneController","ModuleScript")
              },
              sourceAvailable=sourceAvailable,serverRecovery=sourceOk,clientRecovery=clientRecovery
          })
          '''
          r=run_task("10769712413","90623742498445",
                os.environ["ROBLOX_OPEN_CLOUD_API_KEY"],source,read_version=4)
          print("ENTRE_REINOS_V4_READBACK",json.dumps({
              "loadedVersion":r["loadedVersion"],"nodes":r["nodes"],
              "sourceAvailable":r["sourceAvailable"],
              "serverRecovery":r["serverRecovery"],"clientRecovery":r["clientRecovery"]
          },sort_keys=True))
          assert r["loadedVersion"]==4,"Unexpected published revision"
          assert all(r["nodes"].values()),"Missing published T1-R1 code"
          if r["sourceAvailable"]:
              assert r["serverRecovery"] and r["clientRecovery"],"Saved v4 missing resume logic"
          print("ENTRE_REINOS_V4_READBACK_PASS")
          PY
