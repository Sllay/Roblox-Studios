name: S06.6 integrated staging preview v2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/s06-integrated-preview.yml']
permissions:
  contents: read
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - run: python -m unittest discover -s tests -v
      - run: python tools/script_quality.py
      - run: python tools/s06_integrated.py preview --output dist/s06-final
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s06-final-preview
          path: dist/s06-final/
          if-no-files-found: warn
