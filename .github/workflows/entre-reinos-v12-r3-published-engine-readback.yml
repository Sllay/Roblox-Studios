name: Entre Reinos v12 T1-R3 Roblox engine readback (isolated and unsaved)
on:
  push:
    branches: [main]
    paths: [.github/workflows/entre-reinos-v12-r3-published-engine-readback.yml]
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - name: Inspect published Place v12 and exercise R3 inside Roblox Luau
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          PYTHONPATH=tools python - <<'PY'
          import os,json
          from cloud_tasks import run_task
          lua=r'''
          local H=game:GetService("HttpService")
          local RS=game:GetService("ReplicatedStorage")
          local SS=game:GetService("ServerScriptService")
          local SP=game:GetService("StarterPlayer")
          local g=RS:FindFirstChild("Game")
          local living=g and g:FindFirstChild("Living")
          local services=SS:FindFirstChild("Services")
          local client=SP:FindFirstChild("StarterPlayerScripts")
          local function check(parent,name,needle)
              local item=parent and parent:FindFirstChild(name)
              if not item then return false end
              local ok,src=pcall(function() return item.Source end)
              return ok and type(src)=="string" and
                  string.find(src,needle,1,true)~=nil
          end
          local checks={
              liveNPCMotion=check(client,"NPCPresentation","item.smoothedVelocity"),
              motionHold=check(client,"NPCPresentation","movementHold"),
              combatService=check(services,"CombatService","workspace:Raycast(a.p,nextPos-a.p,cast)"),
              combatConnected=check(services,"LivingService","Combat.start(player,state,folder)"),
              r3Tick=check(services,"LivingService","R3.step(state,0.1,x)"),
              saveSchema=check(living,"LivingModel","R3.valid(state.r3)"),
              mobileHUD=check(client,"R3HUD","RunService:BindToRenderStep(\"ER_CoinVFX\""),
              ducalInfection=check(living,"R3Engine","infected_duke"),
              raidAndCoins=check(living,"R3Engine","function R3.pickup("),
              ammoCraft=check(living,"R3Engine","function R3.craftArrows("),
              nativeWater=check(client,"LaneController","h:Move(Vector3.new(x, if swimming then y else 0, 0), false)"),
          }
          local probe={executed=false,migration=false,duke=false,
              invasion=false,coinsSafe=false,worldTerrain=false,issue=""}
          local ok,errorMessage=pcall(function()
              local WorldProfile=require(g:WaitForChild("WorldProfile"))
              local Living=require(living:WaitForChild("LivingModel"))
              local R3=require(living:WaitForChild("R3Engine"))
              local seed=516639272
              local new=Living.new(seed)
              local fresh=R3.ensure(new,true)
              probe.duke=fresh.prologue.stage=="guard" and
                  R3.command(new,"training") and #fresh.enemies==1
              local enemy=fresh.enemies[1]
              local y=WorldProfile.sample(seed,enemy.x,0).height+3.4
              assert(R3.hit(new,enemy.x-1,y,1,6,100))
              R3.step(new,0.1,0)
              probe.invasion=fresh.prologue.stage=="crisis" and #fresh.enemies==4
              local legacy=Living.new(seed)
              local saved=Living.clone(legacy)
              local old=R3.ensure(legacy,false)
              probe.migration=old.prologue.stage=="sandbox" and
                  saved.r3==nil and Living.valid(legacy)
              local walletBefore=fresh.wallet
              R3.command(new,"evacuate") -- must not mint while crisis active
              probe.coinsSafe=(fresh.wallet==walletBefore and
                  R3.pickup(new,9999,0)==false)
              local W=require(services:WaitForChild("WorldService"))
              local created,reason=W.activate(seed)
              probe.worldTerrain=created and W.getChunkCount()==3
                  and tonumber(workspace:GetAttribute("ER_WorldWaterCells"))>0
              probe.executed=true
          end)
          if not ok then probe.issue=tostring(errorMessage):sub(1,300) end
          return H:JSONEncode({revision=game.PlaceVersion,
              placeId=tostring(game.PlaceId),checks=checks,probe=probe})
          '''
          r=run_task("10769712413","90623742498445",
              os.environ["ROBLOX_OPEN_CLOUD_API_KEY"],lua,read_version=12)
          print("ER_V12_R3_ENGINE_READBACK",json.dumps(r,sort_keys=True))
          assert r["loadedVersion"]==12
          assert all(r["checks"].values()),r["checks"]
          p=r["probe"]
          assert all(p[k] for k in ["executed","migration","duke",
                                    "invasion","coinsSafe","worldTerrain"]),p
          print("ER_V12_R3_ENGINE_READBACK_PASS")
          PY
