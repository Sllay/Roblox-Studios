name: P4.3 recover saved layout and integrate scripts
on:
  push:
    branches: [main]
    paths: ['games/maps/mapa-principal/docs/p4-stage-v11-recover-once.trigger']
permissions:
  contents: write
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - run: python -m unittest discover -s tests -v
      - run: python tools/script_quality.py
      - run: bash tools/install-luau-lsp.sh
      - run: python tools/quality_gate_v2.py
      - name: Verify saved v11 without another asset write
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          test "$(cat games/maps/mapa-principal/docs/p4-stage-v11-recover-once.trigger)" = "authorized-recover-v11-r2"
          python tools/p4_stage.py recover-layout
      - name: Record verified baseline
        run: |
          git config user.name "roblox-scene-sync[bot]"
          git config user.email "scene-sync@users.noreply.github.com"
          git add games/maps/mapa-principal/docs/sync/main/staging.json games/maps/mapa-principal/docs/sync/main/staging.summary.json games/maps/mapa-principal/docs/sync/main/patches/p4-environment-layout-approved-v10.json
          git commit -m "sync: P4.3 verified environment layout"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-stage-layout
          path: |
            dist/p4-layout/
            dist/scene-sync/
          if-no-files-found: warn
  scripts:
    needs: layout
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - run: python tools/script_quality.py
      - run: bash tools/install-luau-lsp.sh
      - run: python tools/quality_gate_v2.py
      - name: Apply reviewed scripts against verified layout
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          # Pace the two bounded Open Cloud batches.
          sleep 45
          python tools/p4_stage.py scripts
      - name: Record verified baseline
        run: |
          git config user.name "roblox-scene-sync[bot]"
          git config user.email "scene-sync@users.noreply.github.com"
          git add games/maps/mapa-principal/docs/sync/main/staging.json games/maps/mapa-principal/docs/sync/main/staging.summary.json games/maps/mapa-principal/docs/sync/main/patches/p4-environment-scripts-reviewed.json
          git commit -m "sync: P4.3 verified world clock wind and barrier"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-stage-scripts
          path: |
            dist/scene-patch/
            dist/scene-sync/
          if-no-files-found: warn

  detail-audit:
    needs: scripts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - name: P4.4 exact assets and moss geometry
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          sleep 45
          python tools/assets/p4_detail_preflight.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-detail-preflight
          path: dist/p4-detail/
          if-no-files-found: warn
