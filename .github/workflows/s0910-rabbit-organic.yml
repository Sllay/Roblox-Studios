name: S09.10 Rabbit organic candidate V2
on:
  push:
    branches: [feat/s0910-wildlife]
    paths:
      - '.github/workflows/s0910-rabbit-organic.yml'
      - 'tools/creature_factory/rabbit_organic*.py'
      - 'asset-library/creature-queue/rabbit-v2.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s0910-rabbit-organic
  cancel-in-progress: false
jobs:
  organic:
    if: github.ref == 'refs/heads/feat/s0910-wildlife'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install CPU reconstruction and Blender
        run: |
          python -m pip install numpy scipy scikit-image pillow
          sudo apt-get update
          sudo apt-get install -y blender xvfb libgl1-mesa-dri
      - name: Reconstruct from actual concept pixels
        run: python tools/creature_factory/rabbit_organic_reference.py build dist/creature/rabbit-v2
      - name: Sculpt, reduce, bake atlas, render and GLB roundtrip
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a blender -b --factory-startup --python-exit-code 1 --python tools/creature_factory/rabbit_organic_blender.py -- "$PWD/dist/creature/rabbit-v2"
      - name: Compare silhouette against original references
        id: audit
        continue-on-error: true
        run: python tools/creature_factory/rabbit_organic_reference.py audit dist/creature/rabbit-v2
      - name: Archive review candidate (never approve or publish)
        if: steps.audit.outcome == 'success' || steps.audit.outcome == 'failure'
        run: |
          set -euo pipefail
          revision="asset-library/candidates/rabbit-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -f dist/creature/rabbit-v2/reconstruction.npz dist/creature/rabbit-v2/runtime-mesh.npz
          python tools/asset_factory/persist_candidates.py dist/creature/rabbit-v2 "$revision"
          git config user.name 'asset-factory[bot]'
          git config user.email 'asset-factory[bot]@users.noreply.github.com'
          git add "$revision"
          git commit -m "assets(s0910): archive rabbit organic review candidate ${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            git fetch origin feat/s0910-wildlife
            git rebase origin/feat/s0910-wildlife
            if git push origin HEAD:refs/heads/feat/s0910-wildlife; then exit 0; fi
            sleep 5
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s0910-rabbit-v2-organic
          path: dist/creature/rabbit-v2/
          if-no-files-found: warn
      - name: Enforce silhouette gate
        if: steps.audit.outcome == 'failure'
        run: exit 1
