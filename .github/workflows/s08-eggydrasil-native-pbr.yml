name: S08 Eggydrasil Native PBR
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/s08-eggydrasil-native-pbr.yml']
permissions:
  contents: write
concurrency:
  group: s08-natural-prop-intake
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - name: Author persistent model and validate native roundtrip
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          git config user.name "asset-factory[bot]"
          git config user.email "asset-factory[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          python tools/asset_factory/s08_eggydrasil_pbr.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s08-eggydrasil-native
          path: |
            asset-library/approved/eggydrasil/v8/native/
            asset-library/roblox-receipts/s08-eggydrasil-pbr-proof.json
          if-no-files-found: warn
