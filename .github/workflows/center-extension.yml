name: P3 central terrain and native spawn migration (staging)
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [preview, apply, verify, rollback]
        default: preview
      evidence_run:
        type: string
      confirm_staging:
        type: boolean
        default: false
  push:
    paths: ['games/maps/mapa-principal/docs/center-preview-once.trigger']
permissions:
  contents: read
  actions: read
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  center:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.operation == 'preview' || inputs.operation == 'verify' || inputs.confirm_staging) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - run: python -m unittest discover -s tests -v
      - run: python tools/script_quality.py
      - uses: actions/download-artifact@v4
        if: ${{ inputs.operation == 'verify' || inputs.operation == 'rollback' }}
        with:
          name: center-extension-evidence
          run-id: ${{ inputs.evidence_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/prior-center
      - name: Execute reviewed migration
        env:
          OP: ${{ inputs.operation || 'preview' }}
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          args=()
          if [[ "$OP" == apply || "$OP" == rollback ]]; then args+=(--confirm-staging); fi
          if [[ "$OP" == verify || "$OP" == rollback ]]; then args+=(--evidence dist/prior-center/rollback-evidence.json); fi
          python tools/center_extension.py "$OP" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: center-extension-evidence
          path: dist/center-extension/
          if-no-files-found: warn
