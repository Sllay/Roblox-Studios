name: Creature Factory Next C3 similarity alignment
on:
  pull_request:
    paths:
      - 'tools/creature_factory/next/rigid_alignment.py'
      - 'tools/creature_factory/next/rigid_benchmark.py'
      - 'tests/test_creature_next_similarity.py'
      - '.github/workflows/creature-next-similarity.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  align:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 Pillow==11.3.0 opencv-python-headless==4.11.0.86 trimesh==4.6.8
      - run: python -m unittest tests.test_creature_next_similarity -v
      - name: Restore verified real neural candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for pair in "14208510222 64dc03dbb810cd2518d6b082920e42e7195f1a986ae7ce5e415b624f4a95b474 rabbit" "14207912279 f13996a904665c9206a77bda81edae6bbb33a7d887c602998f62a771a32f6338 fantasy"; do
            read -r id hash name <<< "$pair"
            curl --fail --location --silent --show-error --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/Sllay/Roblox-Studios/actions/artifacts/$id/zip" -o "$RUNNER_TEMP/$name.zip"
            echo "$hash  $RUNNER_TEMP/$name.zip" | sha256sum -c -
            unzip -q "$RUNNER_TEMP/$name.zip" -d "$RUNNER_TEMP/$name"
          done
      - run: python -u -m tools.creature_factory.next.rigid_benchmark "$RUNNER_TEMP/rabbit" "$RUNNER_TEMP/fantasy" dist/creature-next/c3alignment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creature-next-c3alignment
          path: dist/creature-next/c3alignment/
          if-no-files-found: warn
