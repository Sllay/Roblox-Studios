name: S01 read-only publication forensics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/s01-forensics.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: python -m unittest discover -s tests -v
      - run: bash tools/install-luau.sh
      - run: python tools/script_quality.py
      - name: Compile composed inventory and patch
        run: |
          PYTHONPATH=tools python - <<'PY'
          from scene_sync import ROOT,compose_task,compile_task
          from deploy import load_all,resolve
          g,t=load_all();target=resolve(g,t,"mapa-principal","main","staging")
          compile_task(compose_task(target))
          dispatch="do\n"+(ROOT/"tools/sync/patch.luau").read_text()+"\nend"
          compile_task(compose_task(target,dispatch,mode="preview",environment="staging",expectedVersion=14,operations=[]))
          print("S01 composed compiler passed")
          PY
      - name: Compare pinned v13 and v14 without saving
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/default_module_forensics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-forensics
          path: dist/s01/
          if-no-files-found: warn
