name: S08.3 reviewed vegetation publication
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s083-publication.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - uses: actions/download-artifact@v4
        with:
          name: s083-preview
          run-id: 43543767107
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/s083-reviewed
      - name: Publish reviewed density once and verify v22
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/s083_density.py --publish --reviewed dist/s083-reviewed/preview.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s083-publication-proof
          path: dist/s083/
