name: Entre Reinos staging identity (read-only)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/entre-reinos-identity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install read-only provisioning dependencies
        run: python -m pip install Pillow==11.3.0
      - name: Cross-check candidate Place/Universe IDs without writing
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          if [[ -z "$ROBLOX_OPEN_CLOUD_API_KEY" ]]; then
            echo "::error::Missing ROBLOX_OPEN_CLOUD_API_KEY; no remote identity proof."
            exit 1
          fi
          python tools/place_provision.py enroll \
            --game entre-reinos \
            --place main \
            --universe-id 10769712413 \
            --place-id 90623742498445
      - name: Audit saved Place roots before allowing full replacement (read-only)
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          PYTHONPATH=tools python - <<'PY'
          import json, os
          from cloud_tasks import run_task
          source = """
          local Http = game:GetService("HttpService")
          local rootNames = {"Workspace", "ReplicatedStorage", "ServerScriptService", "ServerStorage",
                             "StarterPlayer", "StarterGui", "StarterPack", "Lighting"}
          local roots = {}
          for _, serviceName in ipairs(rootNames) do
              local children = {}
              for _, child in ipairs(game:GetService(serviceName):GetChildren()) do
                  table.insert(children, {name = child.Name, class = child.ClassName})
              end
              roots[serviceName] = children
          end
          return Http:JSONEncode({
              universeId = tostring(game.GameId), placeId = tostring(game.PlaceId),
              placeVersion = game.PlaceVersion, creatorId = tostring(game.CreatorId),
              creatorType = game.CreatorType.Name, roots = roots
          })
          """
          response = run_task("10769712413", "90623742498445",
                              os.environ["ROBLOX_OPEN_CLOUD_API_KEY"], source)
          print("ENTRE_REINOS_READ_ONLY_REMOTE_TREE",
                json.dumps({"version": response["loadedVersion"], "roots": response["roots"]},
                           sort_keys=True, ensure_ascii=False))
          PY
      - name: Read-only verification completed
        if: success()
        run: echo "IDENTITY_VERIFIED_FROM_ROBLOX_ENGINE; no file or Place write performed"
