name: Asset access preflight (read only)
on:
  workflow_dispatch:
    inputs:
      game:
        type: string
        default: mapa-principal
        required: true
      place:
        type: string
        default: main
        required: true
      environment:
        type: choice
        options: [production, staging]
        default: staging
        required: true
      asset_id:
        description: Model asset ID to check
        type: string
        required: true
  push:
    paths: ['games/maps/mapa-principal/docs/asset-access-once.trigger']
permissions:
  contents: read
jobs:
  access:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - name: Classify access and audit without saving
        env:
          GAME: ${{ inputs.game || 'mapa-principal' }}
          PLACE: ${{ inputs.place || 'main' }}
          TARGET_ENV: ${{ inputs.environment || 'production' }}
          ASSET: ${{ inputs.asset_id || '12549617200' }}
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          python tools/assets/access.py --game "$GAME" --place "$PLACE" --environment "$TARGET_ENV" --asset-id "$ASSET"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asset-access-report
          path: dist/asset-access/
          if-no-files-found: warn
