name: Safe Pack Import v2
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [audit, placement-probe, apply]
        default: audit
      game:
        type: string
        default: mapa-principal
      place:
        type: string
        default: main
      asset_id:
        type: string
        default: '79689531752352'
      selector:
        type: string
        default: tree-01-selector.json
      plan:
        type: string
        default: tree-01-p1.json
      x:
        type: string
        default: '40'
      z:
        type: string
        default: '-18'
      yaw:
        type: string
        default: '0'
      confirm_staging:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: roblox-place-write-${{ inputs.game || 'mapa-principal' }}-${{ inputs.place || 'main' }}-staging
  cancel-in-progress: false
jobs:
  pack:
    if: ${{ github.ref == 'refs/heads/main' && (inputs.operation == 'audit' || inputs.operation == 'placement-probe' || (inputs.operation == 'apply' && inputs.confirm_staging)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - run: python -m unittest discover -s tests -v
      - run: python tools/script_quality.py
      - name: Audit or apply reviewed pack submodel
        env:
          OP: ${{ inputs.operation || 'audit' }}
          GAME: ${{ inputs.game || 'mapa-principal' }}
          PLACE: ${{ inputs.place || 'main' }}
          ASSET: ${{ inputs.asset_id || '79689531752352' }}
          SELECTOR: ${{ inputs.selector || 'tree-01-selector.json' }}
          X: ${{ inputs.x }}
          Z: ${{ inputs.z }}
          YAW: ${{ inputs.yaw }}
          PLAN: ${{ inputs.plan || 'tree-01-p1.json' }}
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          [[ "$GAME" =~ ^[a-z][a-z0-9-]*$ && "$SELECTOR" =~ ^[a-z0-9-]+\.json$ && "$PLAN" =~ ^[a-z0-9-]+\.json$ ]] || exit 1
          if [[ "$OP" == audit ]]; then
            python tools/assets/pack_import.py audit --game "$GAME" --place "$PLACE" --asset-id "$ASSET" --selector "games/maps/$GAME/docs/$SELECTOR"
          elif [[ "$OP" == placement-probe ]]; then
            python tools/assets/pack_import.py placement-probe --game "$GAME" --place "$PLACE" --asset-id "$ASSET" --selector "games/maps/$GAME/docs/$SELECTOR" --position "$X" 0 "$Z" --yaw "$YAW"
          else
            python tools/assets/pack_import.py apply --game "$GAME" --place "$PLACE" --plan "games/maps/$GAME/game/assets/imports/$PLAN" --confirm-staging
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pack-import-evidence
          path: dist/pack-import/
          if-no-files-found: warn
