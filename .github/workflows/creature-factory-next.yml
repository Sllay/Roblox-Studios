name: Creature Factory Next read-only baseline

on:
  pull_request:
    paths:
      - 'tools/creature_factory/next/**'
      - 'tests/test_creature_next_audit.py'
      - 'tests/test_creature_next_c1.py'
      - 'docs/benchmarks/creature-factory-next/**'
      - '.github/workflows/creature-factory-next.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c0-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python regression suite
        run: |
          python -m pip install Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.11.0.86 scipy==1.13.1 scikit-image==0.24.0 trimesh==4.6.8 rtree==1.3.0 fast-simplification==0.1.11 jsonschema==4.23.0
          python -m unittest discover -s tests -v
      - name: Install pinned Blender with its bundled Python and NumPy
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/creature-blender"
          curl --fail --location --silent --show-error --retry 2 \
            https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz \
            -o "$RUNNER_TEMP/creature-blender/blender.tar.xz"
          printf '%s  %s\n' 4da1c956673c0485e63054e563ee69198cc8f80d8157dd7592dffc8a6a5592e6 \
            "$RUNNER_TEMP/creature-blender/blender.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/creature-blender/blender.tar.xz" -C "$RUNNER_TEMP/creature-blender"
      - name: Audit preserved candidates without inference or asset writes
        # Keep setup-python's libpython overrides out of the bundled renderer.
        run: |
          env -u LD_LIBRARY_PATH -u PYTHONHOME -u PYTHONPATH \
            /usr/bin/python3 -m tools.creature_factory.next audit \
            --out dist/creature-next/c0-ci --render --resolution 64 --timeout 180 \
            --blender "$RUNNER_TEMP/creature-blender/blender-4.3.2-linux-x64/blender"
      - name: C1 known geometry fixtures and CLI integration
        run: |
          BLENDER="$RUNNER_TEMP/creature-blender/blender-4.3.2-linux-x64/blender"
          env -u LD_LIBRARY_PATH -u PYTHONHOME -u PYTHONPATH python -m tools.creature_factory.next fixtures --out dist/creature-next/c1-ci --blender "$BLENDER" --resolution 128
          python -m tools.creature_factory.next build --manifest dist/creature-next/c1-ci/wavy/manifest.json --out dist/creature-next/c1-job
          python -m tools.creature_factory.next resume --job dist/creature-next/c1-job
          python -m tools.creature_factory.next validate --job dist/creature-next/c1-job
          python -m tools.creature_factory.next.schema_check dist/creature-next/c1-ci dist/creature-next/c1-job
          python -m tools.creature_factory.next legacy-rabbit --source asset-library/references/rabbit-v1
      - name: Preserve C1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creature-next-c1
          path: |
            dist/creature-next/c1-ci/
            dist/creature-next/c1-job/
          if-no-files-found: warn
      - name: Preserve diagnostic outputs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creature-next-c0
          path: dist/creature-next/c0-ci/
          if-no-files-found: warn
