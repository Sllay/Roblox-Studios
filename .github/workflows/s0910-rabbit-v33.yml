name: S09.10 Rabbit hop and ear scratch - staging V33
# V33 was permanently saved and read back on 2026-11-17.
# Retired: a historical one-shot release must never run on new source commits.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Luau validators
        run: |
          python -m pip install Pillow==11.3.0
          bash tools/install-luau.sh
          bash tools/install-luau-lsp.sh
      - name: Static, binary animation, gameplay and Luau hard gate
        run: |
          python tools/script_quality.py
          python -m unittest discover -s tests -p 'test_rabbit_animation_v2.py' -v
          python -m unittest discover -s tests -p 'test_scene_*.py' -v
          python -m unittest discover -s tests -p 'test_script_quality.py' -v
          luau tests/luau/creature_framework.luau
          luau tests/luau/rabbit_runtime.luau
          root=games/maps/mapa-principal/game/places/main/src/ServerScriptService/CreatureFramework
          luau-lsp analyze --definitions="$RS_ROBLOX_DEFINITIONS" "$root/CreatureRegistry.luau" "$root/RobloxMobAdapter.luau"
      - name: Durable commit identity
        run: |
          git config user.name 'roblox-scene-sync[bot]'
          git config user.email 'scene-sync@users.noreply.github.com'
      - name: Native no-save preview: gait clips, interrupted scratch, terrain and AI
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/s0910_rabbit_v33_release.py --preview
      - name: Staging-only V32 to V33 save and readback
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/s0910_rabbit_v33_release.py --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s0910-rabbit-v33-proof
          path: |
            dist/s0910-rabbit-v33-stage/
            games/maps/mapa-principal/docs/s09/publication-rabbit-v33.json
          if-no-files-found: warn
