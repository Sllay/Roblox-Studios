name: S06.1 reviewed staging diagnostic publication
on:
  push:
    branches: [main]
    paths: ['games/maps/mapa-principal/docs/s06-1-publish.trigger']
permissions:
  contents: write
  actions: read
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - run: bash tools/install-luau-lsp.sh
      - run: python -m unittest discover -s tests -v
      - run: python tools/script_quality.py
      - run: python tools/quality_gate_v2.py
      - name: Read reviewed authorization
        id: review
        run: |
          PYTHONPATH=tools python - <<'PY'
          import os
          from pathlib import Path
          from scene_sync import read
          t=read(Path("games/maps/mapa-principal/docs/s06-1-publish.trigger"))
          assert t["environment"]=="staging" and t["expectedVersion"]==15 and t["authorized"] is True
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:f.write("run="+str(t["previewRun"])+"\n")
          PY
      - uses: actions/download-artifact@v4
        with:
          name: s06-diagnostic-preview
          run-id: ${{ steps.review.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/s06-review
      - name: Verify and preserve exact review
        run: |
          PYTHONPATH=tools python - <<'PY'
          import shutil
          from pathlib import Path
          from scene_sync import read,sha
          from s06_diagnostics import make_plan,PLAN
          from scene_patch import prepare
          from deploy import load_all,resolve
          root=Path("games/maps/mapa-principal");src=Path("dist/s06-review");dest=root/"docs/s06/diagnostics-v15";dest.mkdir(parents=True,exist_ok=True)
          trigger=read(root/"docs/s06-1-publish.trigger");m=read(src/"transaction/manifest.json");p=read(src/"plan.json");proof=read(src/"physics-proof.json")
          base=read(root/"docs/sync/main/staging.json");g,t=load_all();target=resolve(g,t,"mapa-principal","main","staging")
          assert p==make_plan(base) and m["planDigest"]==sha(p)==trigger["planDigest"]
          assert m["preparedDigest"]==sha(prepare(target,base,p))==trigger["preparedDigest"]
          assert m["manifestDigest"]==trigger["manifestDigest"]==sha({k:v for k,v in m.items() if k!="manifestDigest"})
          assert proof["matrixVerified"] and proof["noPlaceWrites"] and proof["loadedVersion"]==15
          shutil.copyfile(src/"plan.json",PLAN)
          for a,b in ((src/"physics-proof.json",dest/"physics-proof.json"),(src/"transaction/manifest.json",dest/"manifest.json"),(src/"transaction/preview.json",dest/"preview.json")):shutil.copyfile(a,b)
          PY
          git config user.name "roblox-scene-sync[bot]"
          git config user.email "scene-sync@users.noreply.github.com"
          git add games/maps/mapa-principal/docs/s06/diagnostics-v15 games/maps/mapa-principal/docs/sync/main/patches/s06-1-diagnostics-v15.json
          git commit -m "evidence(s06.1): preserve reviewed diagnostic and collision plan"
          git push origin HEAD:main
      - name: Apply once and independently verify
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/scene_transaction.py apply --plan games/maps/mapa-principal/docs/sync/main/patches/s06-1-diagnostics-v15.json --reviewed dist/s06-review/transaction/manifest.json --confirm-staging --output dist/s06-apply
      - name: Commit verified baseline and receipt
        run: |
          cp dist/s06-apply/receipt.json games/maps/mapa-principal/docs/s06/diagnostics-v15/publication-receipt.json
          git add games/maps/mapa-principal/docs/sync/main/staging.json games/maps/mapa-principal/docs/sync/main/staging.summary.json games/maps/mapa-principal/docs/s06/diagnostics-v15
          git commit -m "sync: S06.1 verified diagnostic and resource physics scripts"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s06-diagnostic-publication
          path: dist/s06-apply/
          if-no-files-found: warn
