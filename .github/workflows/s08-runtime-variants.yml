name: S08 Runtime Variants
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/s08-runtime-variants.yml']
permissions:
  contents: write
concurrency:
  group: s08-natural-prop-intake
  cancel-in-progress: false
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - name: Configure evidence commits
        run: |
          git config user.name "asset-factory[bot]"
          git config user.email "asset-factory[bot]@users.noreply.github.com"
      - name: Probe tree and imported textures
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/asset_factory/s08_texture_probe.py
      - name: Repack exact source geometry
        run: python tools/asset_factory/s08_runtime_repack.py
      - name: Upload and verify compact prop meshes
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/asset_factory/s08_runtime_upload.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s08-runtime-evidence
          path: asset-library/roblox-receipts/
