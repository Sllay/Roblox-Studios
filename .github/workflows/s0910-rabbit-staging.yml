name: S09.10 Rabbit V3 staging installation and shared AI
on:
  push:
    branches: [feat/creature-factory-next]
    paths: ['.github/workflows/s0910-rabbit-staging.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install CI tools
        run: |
          python -m pip install Pillow==11.3.0
          bash tools/install-luau.sh
          bash tools/install-luau-lsp.sh
      - name: Static and unit tests (hard gate before Roblox mutation)
        run: |
          python tools/script_quality.py
          python -m unittest discover -s tests -v
          luau tests/luau/creature_framework.luau
          base=games/maps/mapa-principal/game/places/main/src/ServerScriptService
          for f in "$base"/CreatureFramework/*.luau; do
            luau-lsp analyze --definitions="$RS_ROBLOX_DEFINITIONS" "$f"
          done
          luau-lsp analyze --definitions="$RS_ROBLOX_DEFINITIONS" "$base/CreatureBootstrap.server.luau"
          luau-lsp analyze --definitions="$RS_ROBLOX_DEFINITIONS" games/maps/mapa-principal/game/places/main/src/StarterPlayer/StarterPlayerScripts/CreatureVisual.client.luau
      - name: Configure durable commit author
        run: |
          git config user.name 'roblox-scene-sync[bot]'
          git config user.email 'scene-sync@users.noreply.github.com'
      - name: Native detached preview (no Place write)
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/s0910_rabbit_staging_release.py --preview
      - name: Staging-only one-shot incremental Place publication
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/s0910_rabbit_staging_release.py --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s0910-rabbit-staging-evidence
          path: |
            dist/s0910-rabbit-stage/
            games/maps/mapa-principal/docs/s09/publication-rabbit-v32.json
          if-no-files-found: warn
