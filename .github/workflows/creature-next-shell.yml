name: Creature Factory Next C2 shell visibility diagnostic
on:
  pull_request:
    paths:
      - 'tools/creature_factory/next/shell_visibility.py'
      - 'tools/creature_factory/next/shell_benchmark.py'
      - 'tests/test_creature_next_shell.py'
      - '.github/workflows/creature-next-shell.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU diagnostic dependencies
        run: python -m pip install numpy==2.2.6 Pillow==11.3.0
      - name: Test visibility diagnostic
        run: python -m unittest tests.test_creature_next_shell -v
      - name: Restore verified evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for pair in "14191062045 230dc0856c282900ab722eaf9403e51f7395e849419907ed2fe6e56404ded36b ab" "14199332483 10f4bbdeeb8653c358bf780df51b7c5db5d99ebbe3afaffa91d5abf059880b95 hull" "14200825108 fb1f816c37b35b2067b13193960e29dc656476327679afbb50f97aba2b1416c5 deep"; do
            read -r id hash name <<< "$pair"
            curl --fail --location --silent --show-error --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/Sllay/Roblox-Studios/actions/artifacts/$id/zip" -o "$RUNNER_TEMP/$name.zip"
            echo "$hash  $RUNNER_TEMP/$name.zip" | sha256sum -c -
            unzip -q "$RUNNER_TEMP/$name.zip" -d "$RUNNER_TEMP/$name"
          done
      - name: Evaluate outer hull proximity without neural inference
        run: python -u -m tools.creature_factory.next.shell_benchmark "$RUNNER_TEMP/ab" "$RUNNER_TEMP/hull/c2hull" "$RUNNER_TEMP/deep" dist/creature-next/c2shell
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creature-next-c2shell
          path: dist/creature-next/c2shell/
          if-no-files-found: warn
