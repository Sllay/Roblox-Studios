name: P4 environment preflight (read only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/p4-environment-preflight.yml']
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [scripts-only, all]
        default: scripts-only
permissions:
  contents: read
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  preview:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - run: python tools/script_quality.py
      - name: Exact source audit and script patch preview
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          MODE: ${{ inputs.mode || 'scripts-only' }}
        run: |
          args=()
          if [[ "$MODE" == scripts-only ]]; then args+=(--scripts-only); fi
          python tools/assets/environment_preflight.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-environment-preflight
          path: dist/p4-environment/
          if-no-files-found: warn
