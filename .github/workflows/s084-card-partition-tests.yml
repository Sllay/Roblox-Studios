name: S08.4.1 leaf card partition tests
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s084-card-partition-tests.yml'
      - 'tools/asset_factory/canopy_card_partition.py'
      - 'tests/test_canopy_card_partition.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -p test_canopy_card_partition.py -v
