name: Entre Reinos T1-R1 v5 terrain session repair staging release (one shot)
on:
  push:
    branches: [main]
    paths: [.github/workflows/entre-reinos-v5-terrain-session-release.yml]

permissions:
  actions: write
  contents: write

concurrency:
  group: roblox-place-write-entre-reinos-main-staging
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - name: Review CI, exact game and scope before any write
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          g=Path("games/maps/entre-reinos")
          targets=json.loads((g/"deploy.targets.json").read_text())["environments"]
          assert str(targets["staging"]["universeId"])=="10769712413"
          assert str(targets["staging"]["placeIds"]["main"])=="90623742498445"
          assert targets["production"]["universeId"] is None
          assert targets["production"]["placeIds"]["main"] is None
          assert json.loads((g/"game.manifest.json").read_text())["places"][0]["fullPlaceBuildAuthoritative"]
          server=(g/"game/places/main/src/ServerScriptService/Boot.server.luau").read_text()
          menu=(g/"game/places/main/src/StarterPlayer/StarterPlayerScripts/SlotMenu.luau").read_text()
          save=(g/"game/places/main/src/ServerScriptService/Services/SaveSlotService.luau").read_text()
          world=(g/"game/places/main/src/ServerScriptService/Services/WorldService.luau").read_text()
          assert 'WorldService.getFailure()' in server
          assert 'activeSlot = SaveSlotService.index(player)' in server
          assert 'generationFailure' in world
          assert 'serverRevision' in menu
          assert 'summary.seed' in menu
          assert 'player:GetAttribute("ER_WorldLoaded") ~= true' in save
          assert 'for attempt = 1, 3 do' in save
          print("ENTRE_REINOS_V5_EXACT_SCOPE_AND_REPAIR_CHECK_PASS")
          PY
          result="$(gh api repos/Sllay/Roblox-Studios/actions/runs/44978837907 --jq .conclusion)"
          [[ "$result" == success ]] || { echo "::error::V5 tested code CI not successful"; exit 1; }
          echo "ENTRE_REINOS_V5_CI_PASS"
      - name: Read and pin the current revision 4 Place inventory
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          python tools/scene_sync.py --game entre-reinos --place main --environment staging --expected-version 4 --record
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("games/maps/entre-reinos/docs/sync/main/staging.summary.json")
          s=json.loads(p.read_text())
          assert s["loadedVersion"]==4
          assert str(s["universeId"])=="10769712413"
          assert str(s["placeId"])=="90623742498445"
          assert s["total"]>=65
          roots={r["name"] for r in s["workspaceRoots"]}
          assert "StartArea" in roots and "Baseplate" not in roots
          print("ENTRE_REINOS_V4_BASELINE_VERIFIED",s["stateDigest"])
          PY
      - name: Commit the newly observed baseline without forcing Git
        run: |
          git config user.name "entre-reinos-v5-release[bot]"
          git config user.email "entre-reinos-v5-release@users.noreply.github.com"
          git add -- games/maps/entre-reinos/docs/sync/main/staging.json games/maps/entre-reinos/docs/sync/main/staging.summary.json
          if ! git diff --cached --quiet; then
            git commit -m "sync(entre-reinos): capture verified staging v4 before v5 repair"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Dispatch official guarded staging-only Place publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          local_sha="$(git rev-parse HEAD)"
          current_sha="$(gh api repos/Sllay/Roblox-Studios/git/ref/heads/main --jq .object.sha)"
          [[ "$local_sha" == "$current_sha" ]] || { echo "::error::main changed before release"; exit 1; }
          gh api -X POST repos/Sllay/Roblox-Studios/actions/workflows/publish.yml/dispatches --input - <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "game": "entre-reinos",
              "place": "main",
              "environment": "staging",
              "confirm_publish": "true",
              "confirm_full_place_replacement": "true"
            }
          }
          JSON
          echo "ENTRE_REINOS_V5_STAGING_DISPATCHED; verify official publish job revision and isPublished"
