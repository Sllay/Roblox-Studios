name: Entre Reinos v7 published native controls and safe HUD readback (read-only)
on:
  push:
    branches: [main]
    paths: [.github/workflows/entre-reinos-v7-native-mobile-controls-readback.yml]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - name: Read saved Place v7 and check stock PlayerModule control wiring
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          PYTHONPATH=tools python - <<'PY'
          import os,json
          from cloud_tasks import run_task
          script = '''
          local H=game:GetService("HttpService")
          local R=game:GetService("ReplicatedStorage")
          local SP=game:GetService("StarterPlayer")
          local folder=SP:FindFirstChild("StarterPlayerScripts")
          local shared=R:FindFirstChild("Game")
          local function source(root,name)
              local obj=root and root:FindFirstChild(name)
              if not obj then return nil end
              local ok,body=pcall(function()return obj.Source end)
              if not ok then return nil end
              return body
          end
          local lane=source(folder,"LaneController")
          local client=source(folder,"ClientBoot")
          local projection=source(shared,"InputProjection")
          local function contains(hay,needle)
              return type(hay)=="string" and string.find(hay,needle,1,true)~=nil
          end
          local checks={
              laneExists=type(lane)=="string",
              nativeInput=contains(lane,"controls:GetMoveVector()"),
              noCustomTouchButtons=not contains(lane,"ContextActionService"),
              nativeJumpUntouched=not contains(lane,"BindActionAtPriority("),
              landProjection=contains(lane,"h:Move(Vector3.new(x, 0, 0), false)"),
              waterProjection=contains(lane,"v.PlaneVelocity = swimFiltered"),
              analogModule=contains(projection,"function Projection.toLane"),
              upToHeight=contains(projection,"math.clamp(-z, -1, 1)"),
              hudRespectsCoreUI=contains(client,"Enum.ScreenInsets.CoreUISafeInsets"),
              hudRight=contains(client,"stats.AnchorPoint = Vector2.new(1, 0)"),
              hudNotBehindTopbar=contains(client,"gui.IgnoreGuiInset = false"),
          }
          local px=0
          local py=0
          local pureOk, pureError=pcall(function()
              local mod=require(shared:WaitForChild("InputProjection"))
              px,py=mod.toLane(1,-1)
          end)
          return H:JSONEncode({
              universeId=tostring(game.GameId),placeId=tostring(game.PlaceId),
              version=game.PlaceVersion,checks=checks,
              analogModuleRuns=pureOk,analogError=if pureOk then "" else tostring(pureError),
              normalizedDiagonal=math.abs(px-0.70710678)<0.00001
                  and math.abs(py-0.70710678)<0.00001,
              maxPlayers=game:GetService("Players").MaxPlayers
          })
          '''
          r=run_task("10769712413","90623742498445",
                os.environ["ROBLOX_OPEN_CLOUD_API_KEY"],script,read_version=7)
          print("ENTRE_REINOS_V7_NATIVE_READBACK",json.dumps({
              "loadedVersion":r["loadedVersion"],"checks":r["checks"],
              "analogModuleRuns":r["analogModuleRuns"],
              "normalizedDiagonal":r["normalizedDiagonal"],
              "maxPlayers":r["maxPlayers"]
          },sort_keys=True))
          assert r["loadedVersion"]==7
          assert all(r["checks"].values()), "Published code missing native controller/HUD"
          assert r["analogModuleRuns"] and r["normalizedDiagonal"], "Analog projection invalid in Roblox engine"
          print("ENTRE_REINOS_V7_NATIVE_READBACK_PASS")
          PY
