name: Entre Reinos T1-R1 seed sweep (unsaved engine sessions)
on:
  push:
    branches: [main]
    paths: [.github/workflows/entre-reinos-seed-terrain-sweep.yml]
permissions:
  contents: read
jobs:
  seed_sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - name: Verify different world seeds in independent sessions, no saves
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          PYTHONPATH=tools python - <<'PY'
          import os,json,time
          from cloud_tasks import run_task
          code = """
          local H=game:GetService("HttpService")
          local svc=require(game:GetService("ServerScriptService"):WaitForChild("Services"):WaitForChild("WorldService"))
          local p=require(game:GetService("ReplicatedStorage"):WaitForChild("Game"):WaitForChild("WorldProfile"))
          local seed=__SEED__
          local before=os.clock()
          local ok,result,reason=pcall(svc.activate,seed)
          local outcome={
            universeId=tostring(game.GameId),placeId=tostring(game.PlaceId),
            seed=seed,callOk=ok,active=svc.isActive(),worldOk=if ok then result else false,
            reason=if ok then tostring(reason or "") else tostring(result),
            elapsedMs=math.floor((os.clock()-before)*1000),
            waterCells=tonumber(workspace:GetAttribute("ER_WorldWaterCells")) or 0,
            signature=tostring(workspace:GetAttribute("ER_WorldSignature") or "")
          }
          return H:JSONEncode(outcome)
          """
          seeds=[1,42,1009,870001,123456789,1076971241,2147483646]
          for seed in seeds:
            start=time.monotonic()
            try:
              r=run_task("10769712413","90623742498445",
                  os.environ["ROBLOX_OPEN_CLOUD_API_KEY"],
                  code.replace("__SEED__",str(seed)),read_version=4)
              print("ENTRE_REINOS_SEED_SWEEP",json.dumps({k:v for k,v in r.items()
                  if k in ("seed","callOk","worldOk","active","reason","elapsedMs","waterCells","signature","loadedVersion")},sort_keys=True),flush=True)
              if not (r.get("callOk") and r.get("worldOk") and r.get("active")):
                raise RuntimeError("World seed failed: "+str(seed))
            except Exception as e:
              print("ENTRE_REINOS_SEED_SWEEP_FAILURE",repr(e),flush=True)
              raise
          print("ENTRE_REINOS_SEED_SWEEP_PASS",len(seeds))
          PY
