name: S08 Layered Hull
on:
  push:
    paths:
      - 'tools/asset_factory/layered_hull.py'
      - 'tools/asset_factory/run.py'
      - '.github/workflows/s08-layered-hull.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install numpy scipy scikit-image pillow
      - name: Exercise layered executor
        run: |
          mkdir -p /tmp/layered
          python - <<'PY'
          import numpy as np,json
          from PIL import Image
          from pathlib import Path
          p=Path('/tmp/layered')
          layers=[]
          for name,op,lo,hi in [('base','union',8,48),('extension','union',35,57),('cavity','subtract',20,30)]:
              m=np.zeros((64,64),dtype=np.uint8);m[lo:hi,lo:hi]=255
              Image.fromarray(m).save(p/(name+'.png'))
              layers.append(dict(operation=op,references={k:name+'.png' for k in ('front','right','top')}))
          (p/'job.json').write_text(json.dumps(dict(schema=1,mode='layered_multi_view',layers=layers,triangle_budget=100000)))
          PY
          python tools/asset_factory/run.py --job /tmp/layered/job.json --out /tmp/layered/out
          PYTHONPATH=tools/asset_factory python - <<'PY'
          import numpy as np
          from layered_hull import compose
          m=np.zeros((32,32),bool);m[4:28,4:28]=True
          c=np.zeros_like(m);c[12:20,12:20]=True
          views=lambda a:{k:a for k in ('front','right','top')}
          v,f=compose([('union',views(m)),('subtract',views(c))],0)
          assert len(f)>0 and np.isfinite(v).all()
          edges=np.sort(np.concatenate([f[:,[0,1]],f[:,[1,2]],f[:,[2,0]]]),axis=1)
          assert np.all(np.unique(edges,axis=0,return_counts=True)[1]==2)
          assert np.any(np.max(np.abs(v),axis=1)<.3), 'cavity surface missing'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: layered-hull-test
          path: /tmp/layered/
