name: Versioned scene snapshot (read only)
on:
  workflow_dispatch:
    inputs:
      game:
        type: string
        default: mapa-principal
        required: true
      place:
        type: string
        default: main
        required: true
      environment:
        type: choice
        options: [production, staging]
        default: production
        required: true
permissions:
  contents: read
jobs:
  snapshot:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - name: Capture structural snapshot
        env:
          GAME: ${{ inputs.game || 'mapa-principal' }}
          PLACE: ${{ inputs.place || 'main' }}
          TARGET_ENV: ${{ inputs.environment || 'production' }}
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/scene_snapshot.py --game "$GAME" --place "$PLACE" --environment "$TARGET_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: versioned-scene-snapshot
          path: dist/snapshot/
          if-no-files-found: error
