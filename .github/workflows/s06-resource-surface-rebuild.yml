name: S06.7 exact voxel surface rebuild contact probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/s06-resource-surface-rebuild.yml']
permissions:
  contents: write
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - run: python tools/resource_surface_rebuild_probe.py --output dist/s067-surface
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
      - name: Preserve exact surface evidence
        run: |
          cp dist/s067-surface/*.json games/maps/mapa-principal/docs/s06/resource-contact-v17/
          git config user.name "roblox-scene-sync[bot]"
          git config user.email "scene-sync@users.noreply.github.com"
          git add games/maps/mapa-principal/docs/s06/resource-contact-v17
          git commit -m "evidence(s06.7): exact terrain channel rebuild and actual surface ray measurements"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s067-surface-rebuild
          path: dist/s067-surface/
          if-no-files-found: warn
