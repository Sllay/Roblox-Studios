name: P4 asset intake (read only)
on:
  push:
    branches: [main]
    paths: ['games/maps/mapa-principal/game/assets/intake-p4.json', '.github/workflows/p4-asset-intake.yml']
  workflow_dispatch:
    inputs:
      batch:
        type: choice
        options: ['all', '1', '2', '3', '4']
        default: 'all'
        required: true
permissions:
  contents: read
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  inventory:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - name: Inventory selected packs without saving
        env:
          BATCH: ${{ inputs.batch || 'all' }}
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/assets/intake.py --batch "$BATCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-asset-intake
          path: dist/p4-intake/
          if-no-files-found: warn
