name: S01 hash-bound transaction preview (read only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/s01-transaction-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: python -m unittest discover -s tests -v
      - run: bash tools/install-luau.sh
      - name: Read-only diagnostic preview (never apply)
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          PYTHONPATH=tools python - <<'PY'
          from scene_sync import ROOT,read,write
          b=read(ROOT/"games/maps/mapa-principal/docs/sync/main/staging.json")
          write(ROOT/"dist/s01-preview/diagnostic-plan.json",{"schemaVersion":1,"expectedVersion":b["loadedVersion"],"baselineDigest":b["stateDigest"],"operations":[{"kind":"add_part","parentKey":"service:Workspace","name":"RS S01 Diagnostic Preview Only","id":"s01-diagnostic-preview","changes":{"cframe":[0,100,0,1,0,0,0,1,0,0,0,1],"size":[1,1,1],"canCollide":False}}]})
          PY
          python tools/scene_transaction.py preview --plan dist/s01-preview/diagnostic-plan.json --output dist/s01-preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-transaction-preview
          path: dist/s01-preview/
          if-no-files-found: warn
