name: S08.4 foliage material preview
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s084-foliage-preview.yml'
      - 'tools/s084_foliage_preview.py'
      - 'tools/sync/s084_foliage_preview.luau'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - name: Native foliage comparison (no place writes)
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/s084_foliage_preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s084-foliage-preview
          path: dist/s084/
