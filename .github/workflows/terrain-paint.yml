name: Native Terrain Paint (staging)
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [preview, apply]
        default: preview
      plan:
        type: string
        default: paint-example.json
      baseline_run:
        type: string
        description: Preview workflow run ID (required for apply)
      confirm_staging:
        type: boolean
        default: false
  push:
    paths: ['games/maps/mapa-principal/docs/terrain-paint-once.trigger']
permissions:
  contents: read
  actions: read
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  paint:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.operation == 'preview' || inputs.confirm_staging) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - uses: actions/download-artifact@v4
        if: ${{ inputs.operation == 'apply' }}
        with:
          name: terrain-paint-evidence
          run-id: ${{ inputs.baseline_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/prior-paint
      - name: Preview or apply material-only edit
        env:
          OP: ${{ inputs.operation || 'preview' }}
          PLAN: ${{ inputs.plan || 'paint-example.json' }}
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          [[ "$PLAN" =~ ^[a-z0-9-]+\.json$ ]] || exit 1
          args=()
          if [[ "$OP" == apply ]]; then args+=(--baseline dist/prior-paint/preview.json --confirm-staging); fi
          python tools/terrain_paint.py "$OP" --plan "games/maps/mapa-principal/game/terrain/$PLAN" "${args[@]}"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            python -c 'import json; r=json.load(open("dist/terrain-paint/preview.json")); assert r["loadedVersion"]==4 and r["changedVoxels"]>0'
            python tools/terrain_paint.py apply --plan "games/maps/mapa-principal/game/terrain/$PLAN" --baseline dist/terrain-paint/preview.json --confirm-staging
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-paint-evidence
          path: dist/terrain-paint/
          if-no-files-found: warn
