name: Rabbit V41 motion preview (NO PUBLISH)
on:
  push:
    branches: [feat/creature-factory-next]
    paths:
      - 'tools/creature_factory/rabbit_animation_author_v41.py'
      - '.github/workflows/rabbit-v41-run-anatomy-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.2.6 scipy==1.16.2 Pillow==11.3.0
      - name: Verify Python animation author syntax
        run: python -m py_compile tools/creature_factory/rabbit_animation_author_v41.py
      - name: Generate candidate V41 native motion
        run: |
          python tools/creature_factory/rabbit_animation_author_v41.py \
            asset-library/candidates/rabbit-v3-cartoon-v2-mobile-lod0/asset.glb \
            dist/rabbit-v41-preview
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender xvfb libgl1-mesa-dri python3-numpy
      - name: Render real skinned mesh frames
        run: |
          xvfb-run -a blender -b --factory-startup --python-exit-code 1 \
            --python tools/creature_factory/rabbit_v34_blender_review.py -- \
            "$PWD/asset-library/candidates/rabbit-v3-cartoon-v2-mobile-lod0/asset.blend" \
            "$PWD/asset-library/roblox-receipts/s0910-rabbit/rabbit-native-proof.json" \
            "$PWD/dist/rabbit-v41-preview" "$PWD/dist/rabbit-v41-preview"
      - name: Create animated GIF previews from actual rendered mesh
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          p=Path('dist/rabbit-v41-preview')
          for clip in ('idle','walk','run','scratchear'):
            for view in ('side','three-quarter'):
              frames=[Image.open(f).convert('RGBA') for f in sorted(p.glob(f'{clip}-{view}-*.png'))]
              assert len(frames)>=3,(clip,view)
              frames[0].save(p/f'GIF-{clip}-{view}.gif',save_all=True,
                             append_images=frames[1:],duration=170,loop=0,disposal=2)
          print('V41_GIFS_RENDERED_FROM_REAL_SKINNED_MESH')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rabbit-v41-real-mesh-gifs-NOT-PUBLISHED
          path: dist/rabbit-v41-preview/
          if-no-files-found: warn
