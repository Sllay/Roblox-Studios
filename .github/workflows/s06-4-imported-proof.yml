name: S06.4 verify existing imported canopy without EditableMesh
on:
  push:
    branches: [main]
    paths: ['games/maps/mapa-principal/docs/s06-4-imported-proof.trigger']
permissions:
  contents: write
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - name: Read imported geometry and bone structure
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/imported_canopy_probe.py
      - name: Persist exact proof
        run: |
          cp dist/s06-4-imported/imported-proof.json games/maps/mapa-principal/docs/s06/wind-v16/permission-retry/
          git config user.name "roblox-scene-sync[bot]"
          git config user.email "scene-sync@users.noreply.github.com"
          git add games/maps/mapa-principal/docs/s06/wind-v16/permission-retry/imported-proof.json
          git commit -m "evidence(s06.4): inspect already imported original canopy without vertex API"
          git push origin HEAD:main
