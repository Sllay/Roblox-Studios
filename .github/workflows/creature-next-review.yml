name: Creature Factory Next functional gate review
on:
  pull_request:
    paths:
      - 'tools/creature_factory/next/pipeline_stages.py'
      - 'tools/creature_factory/next/surface_refinement.py'
      - 'tools/creature_factory/next/uv_atlas.py'
      - 'tools/creature_factory/next/review_smoke.py'
      - 'tests/test_creature_next_review_pipeline.py'
      - '.github/workflows/creature-next-review.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.13.1 scikit-image==0.24.0 Pillow==11.3.0 opencv-python-headless==4.11.0.86 trimesh==4.6.8 rtree==1.3.0 fast-simplification==0.1.11 xatlas==0.0.9
      - run: python -m unittest tests.test_creature_next_review_pipeline -v
      - name: Restore verified neural master for functional gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/Sllay/Roblox-Studios/actions/artifacts/14148598078/zip -o "$RUNNER_TEMP/checkpoint.zip"
          echo "d045c52dd746d74db9b37dd5b974791c52a11813750efdd2b38536e5d706dd9c  $RUNNER_TEMP/checkpoint.zip" | sha256sum -c -
      - run: python -u -m tools.creature_factory.next.review_smoke "$RUNNER_TEMP/checkpoint.zip" dist/creature-next/review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creature-next-review
          path: dist/creature-next/review/
          if-no-files-found: warn
