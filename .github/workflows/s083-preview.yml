name: S08.3 vegetation density preview
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s083-preview.yml'
      - 'tools/s083_density.py'
      - 'tools/sync/s083_density.luau'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - name: Native density preview
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/s083_density.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s083-preview
          path: dist/s083/
