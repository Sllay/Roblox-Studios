name: S08 Eggydrasil V4
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/asset_factory/eggydrasil_v4.py'
      - '.github/workflows/s08-eggydrasil-v4.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y blender python3-numpy
      - name: Generate direct geometry and renders
        run: blender -b --factory-startup --python-exit-code 1 --python tools/asset_factory/eggydrasil_v4.py -- /tmp/eggydrasil-v4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eggydrasil-v4
          path: /tmp/eggydrasil-v4/
