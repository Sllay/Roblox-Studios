name: P4 valley refinement (staging)
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [preview, apply, verify]
        default: preview
      evidence_run:
        type: string
      confirm_staging:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  valley:
    if: ${{ github.ref == 'refs/heads/main' && (inputs.operation != 'apply' || inputs.confirm_staging) }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - run: python -m unittest discover -s tests -v
      - run: python tools/script_quality.py
      - run: bash tools/install-luau-lsp.sh
      - run: python tools/quality_gate_v2.py
      - uses: actions/download-artifact@v4
        if: ${{ inputs.operation == 'apply' || inputs.operation == 'verify' }}
        with:
          name: valley-refine-evidence
          run-id: ${{ inputs.evidence_run || '43158101058' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/prior-valley
      - name: Preview or apply
        env:
          OP: ${{ inputs.operation || 'preview' }}
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          args=()
          if [[ "$OP" == apply ]]; then args+=(--baseline dist/prior-valley/preview.json --confirm-staging); fi
          if [[ "$OP" == verify ]]; then args+=(--receipt dist/prior-valley/receipt.json); fi
          python tools/valley_refine.py "$OP" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valley-refine-evidence
          path: dist/valley-refine/
          if-no-files-found: warn
