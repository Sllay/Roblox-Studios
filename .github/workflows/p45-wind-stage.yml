name: P4.5 verified wind correction (staging)
on:
  push:
    branches: [main]
    paths: ['games/maps/mapa-principal/docs/p45-wind-v13-once.trigger']
permissions:
  contents: write
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - run: bash tools/install-luau-lsp.sh
      - run: python -m unittest discover -s tests -v
      - run: python tools/script_quality.py
      - run: python tools/quality_gate_v2.py
      - name: Apply exact approved wind correction
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          test "$(cat games/maps/mapa-principal/docs/p45-wind-v13-once.trigger)" = "authorized-staging-v13-wind"
          python tools/verified_script_stage.py --plan games/maps/mapa-principal/docs/sync/main/patches/p45-wind-reviewed-v13.json --confirm-staging
      - name: Commit verified scene
        run: |
          git config user.name "roblox-scene-sync[bot]"
          git config user.email "scene-sync@users.noreply.github.com"
          git add games/maps/mapa-principal/docs/sync/main/staging.json games/maps/mapa-principal/docs/sync/main/staging.summary.json
          git commit -m "sync: P4.5 verified foliage wind correction"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p45-wind-verification
          path: dist/verified-script-stage/
          if-no-files-found: warn
