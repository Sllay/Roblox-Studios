name: S06.2 unified vegetation preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/s06-regeneration.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - run: python -m unittest discover -s tests -v
      - run: python tools/vegetation_regeneration.py
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
      - name: Deterministic replay
        run: |
          cp dist/s06-2/plan.json dist/first-plan.json
          python tools/vegetation_regeneration.py --offline
          cmp dist/first-plan.json dist/s06-2/plan.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s06-2-regeneration
          path: dist/s06-2/
          if-no-files-found: warn
