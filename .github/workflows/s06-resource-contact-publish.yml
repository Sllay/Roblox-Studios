name: S06.7 reviewed resource contact staging publication
on:
  push:
    branches: [main]
    paths: ['.github/workflows/s06-resource-contact-publish.yml']
permissions:
  contents: write
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - name: Verify exact transaction and inverse
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/resource_contact_publish.py preview --output dist/s067-publish-preview
      - name: Preserve pre-save state and exact expected result
        run: |
          DEST=games/maps/mapa-principal/docs/s06/resource-contact-publish-v18
          mkdir -p "$DEST"
          cp dist/s067-publish-preview/*.json "$DEST"/
          cp games/maps/mapa-principal/docs/sync/main/staging.json "$DEST/baseline-v17.json"
          git config user.name "roblox-scene-sync[bot]"
          git config user.email "scene-sync@users.noreply.github.com"
          git add "$DEST"
          git commit -m "evidence(s06.7): preserve reviewed v18 resource transaction and v17 baseline"
          git push origin HEAD:main
      - name: Apply once and independently verify staging
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/resource_contact_publish.py apply --reviewed dist/s067-publish-preview --output dist/s067-publish-apply
      - name: Persist verified live baseline
        run: |
          DEST=games/maps/mapa-principal/docs/s06/resource-contact-publish-v18
          cp dist/s067-publish-apply/receipt.json "$DEST/publication-receipt.json"
          cp dist/s067-publish-apply/verification.json "$DEST/persisted-verification.json"
          git add "$DEST" games/maps/mapa-principal/docs/sync/main/staging.json games/maps/mapa-principal/docs/sync/main/staging.summary.json
          git commit -m "sync: S06.7 verified v18 staging resource support and doubled sticks"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s067-resource-publication
          path: |
            dist/s067-publish-preview/
            dist/s067-publish-apply/
          if-no-files-found: warn
