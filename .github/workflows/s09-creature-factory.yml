name: S09 Creature Factory - Chicken V1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/creature_factory/**'
      - 'asset-library/creature-queue/chicken-v1.json'
      - '.github/workflows/s09-creature-factory.yml'
permissions:
  contents: write
concurrency:
  group: s09-creature-factory
  cancel-in-progress: false
jobs:
  chicken:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Blender
        run: sudo apt-get update && sudo apt-get install -y blender xvfb
      - name: Author, render and verify GLB
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a blender -b --factory-startup --python-exit-code 1 --python tools/creature_factory/chicken_v1.py -- "$PWD/asset-library/creature-queue/chicken-v1.json" "$PWD/dist/creature/chicken-v1"
      - name: Archive candidate
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          revision="asset-library/candidates/chicken-v1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 tools/asset_factory/persist_candidates.py dist/creature/chicken-v1 "$revision"
          git config user.name "asset-factory[bot]"
          git config user.email "asset-factory[bot]@users.noreply.github.com"
          git add "$revision"
          git commit -m "assets: archive S09 chicken candidate ${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s09-chicken-v1
          path: dist/creature/chicken-v1/
          if-no-files-found: warn
