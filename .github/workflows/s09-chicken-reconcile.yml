name: S09 Chicken upload reconciliation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/creature_factory/chicken_reconcile.py'
      - '.github/workflows/s09-chicken-reconcile.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          git config user.name "asset-factory[bot]"
          git config user.email "asset-factory[bot]@users.noreply.github.com"
      - env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/creature_factory/chicken_reconcile.py
