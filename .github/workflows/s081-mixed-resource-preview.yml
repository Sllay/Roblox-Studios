name: S08.1 mixed resource preview
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s081-mixed-resource-preview.yml'
      - 'tools/s081_mixed_resources.py'
      - 'tools/sync/s081_mixed_resources.luau'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - run: python tools/asset_factory/s08_release_gate.py
      - name: Disposable mixed resource and central tree preview
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/s081_mixed_resources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s081-mixed-preview
          path: dist/s081/
