name: S06.1 diagnostics and physics preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/s06-diagnostics-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - run: python -m unittest discover -s tests -v
      - run: python tools/script_quality.py
      - name: Probe collision API and preview scripts
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          python tools/s06_diagnostics.py
          python tools/scene_transaction.py preview --plan games/maps/mapa-principal/docs/sync/main/patches/s06-1-diagnostics-v15.json --output dist/s06/transaction
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s06-diagnostic-preview
          path: dist/s06/
          if-no-files-found: warn
