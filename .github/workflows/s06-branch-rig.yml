name: S06.4 original skinned canopy and native bone proof
on:
  push:
    branches: [main]
    paths: ['.github/workflows/s06-branch-rig.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - run: python tools/assets/author_pine_rig.py --output dist/s06-4
      - run: python tools/branch_wind_probe.py --output dist/s06-4
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s06-4-rig
          path: dist/s06-4/
