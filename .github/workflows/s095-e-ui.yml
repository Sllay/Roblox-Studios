name: S09.5-E Book and developer console
on:
  push:
    branches: [main]
    paths:
      - 'tools/creature_factory/chicken_ui_probe.py'
      - 'tools/sync/s095_e_native.luau'
      - 'games/maps/mapa-principal/game/places/main/src/StarterPlayer/StarterPlayerScripts/BookView.luau'
      - 'games/maps/mapa-principal/game/places/main/src/ServerScriptService/CreatureFramework/DeveloperPolicy.luau'
      - 'games/maps/mapa-principal/game/places/main/src/ServerScriptService/CreatureFramework/BookServer.luau'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s095-e-ui
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - run: bash tools/install-luau-lsp.sh
      - run: luau-lsp analyze --definitions="$RS_ROBLOX_DEFINITIONS" "games/maps/mapa-principal/game/places/main/src/StarterPlayer/StarterPlayerScripts/BookView.luau"
      - run: |
          git config user.name "asset-factory[bot]"
          git config user.email "asset-factory[bot]@users.noreply.github.com"
      - env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/creature_factory/chicken_ui_probe.py
