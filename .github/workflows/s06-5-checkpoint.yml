name: S06.5 durable parity and compatibility checkpoint
on:
  push:
    branches: [main]
    paths: ['games/maps/mapa-principal/docs/s06-5-checkpoint.trigger']
permissions:
  contents: write
  actions: read
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - uses: actions/download-artifact@v4
        with:
          name: s06-5-shard-proof
          run-id: 43284421059
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/s06-5
      - uses: actions/download-artifact@v4
        with:
          name: s06-5-asset-audit
          run-id: 43284272134
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/s06-5
      - name: Preserve exact evidence before further probes
        run: |
          PYTHONPATH=tools python - <<'PY'
          from pathlib import Path
          from scene_sync import read
          from collections import Counter
          import shutil,json
          src=Path("dist/s06-5");root=Path("games/maps/mapa-principal");dest=root/"docs/s06/compatibility-v16";dest.mkdir(parents=True,exist_ok=True)
          s=read(src/"shard-proof.json");a=read(src/"asset-runtime-audit.json");b=read(root/"docs/sync/main/staging.summary.json")
          assert s["stateDigest"]==b["stateDigest"] and s["total"]==b["total"]==4228 and s["parityVerified"] and s["loadedVersion"]==a["loadedVersion"]==16 and a["models"]==390
          assert s["noPlaceWrites"] and a["noPlaceWrites"] and not a["clientRenderVerified"]
          for n in ("shard-proof.json","asset-runtime-audit.json"):shutil.copyfile(src/n,dest/n)
          counts=Counter((x["preload"],x["fetch"]) for x in a["dependencies"])
          print("S065_DEPENDENCY_STATUS "+json.dumps([{"preload":k[0],"fetch":k[1],"count":v} for k,v in counts.items()]))
          print("S065_DEPENDENCY_UNCONFIRMED "+json.dumps([{"uri":x["uri"],"roles":x["roles"],"assets":x["assets"],"preload":x["preload"],"fetch":x["fetch"]} for x in a["dependencies"] if x["preload"]!="Success" and x["fetch"]!="Success"]))
          PY
          git config user.name "roblox-scene-sync[bot]"
          git config user.email "scene-sync@users.noreply.github.com"
          git add games/maps/mapa-principal/docs/s06/compatibility-v16
          git commit -m "evidence(s06.5): persist sharded parity and installed asset audit"
          git push origin HEAD:main
      - name: Test reversible default-module reduction in disposable session
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/default_cleanup_preview.py
      - name: Persist native recovery evidence
        run: |
          cp dist/s06-5/default-cleanup-proof.json games/maps/mapa-principal/docs/s06/compatibility-v16/
          git add games/maps/mapa-principal/docs/s06/compatibility-v16
          git commit -m "evidence(s06.5): reversible native default-module reduction proof"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s06-5-checkpoint
          path: dist/s06-5/
