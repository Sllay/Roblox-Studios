name: S09.10 Rabbit native GLB import (staging, no place write)
on:
  push:
    branches: [feat/creature-factory-next]
    paths:
      - '.github/workflows/s0910-rabbit-native-import.yml'
      - 'tools/creature_factory/rabbit_native_import.py'
      - 'tools/sync/s0910_rabbit_native_probe.luau'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s0910-rabbit-native-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: bash tools/install-luau.sh
      - name: Journal one-shot model upload and run detached skinned native audit
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          git config user.name 'asset-factory[bot]'
          git config user.email 'asset-factory[bot]@users.noreply.github.com'
          python tools/creature_factory/rabbit_native_import.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s0910-rabbit-native-import-evidence
          path: asset-library/roblox-receipts/s0910-rabbit/
          if-no-files-found: warn
