name: Rabbit V39 upright hop and frontpaw ear grooming review (NO PUBLISH)
on:
  push:
    branches: [feat/creature-factory-next]
    paths:
      - 'tools/creature_factory/rabbit_animation_author_v39.py'
      - 'tests/test_rabbit_animation_v39.py'
      - '.github/workflows/rabbit-v39-motion-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rabbit-v39-review
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned inverse-kinematics dependencies
        run: python -m pip install numpy==2.2.6 scipy==1.16.2 Pillow==11.3.0
      - name: Validate four actual 19-bone source motions and stance regression
        run: python -m unittest discover -s tests -p 'test_rabbit_animation_v39.py' -v
      - name: Author independent, NOT-uploaded native KeyframeSequences
        run: |
          python tools/creature_factory/rabbit_animation_author_v39.py \
            asset-library/candidates/rabbit-v3-cartoon-v2-mobile-lod0/asset.glb \
            dist/rabbit-v39-review
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('dist/rabbit-v39-review/manifest.json').read_text())
          assert m['stage']=='v39_preview_only_not_uploaded'
          assert m['gait_contract']['Walk']=='upright_hind_hop_front_hands_carried'
          print('V39_FK_REVIEW_ONLY')
          PY
      - name: Install Blender CPU for actual skin deformation review
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender xvfb libgl1-mesa-dri python3-numpy
      - name: Render actual rabbit mesh in Idle Walk Run ScratchEar
        run: |
          xvfb-run -a blender -b --factory-startup --python-exit-code 1 \
            --python tools/creature_factory/rabbit_v34_blender_review.py -- \
            "$PWD/asset-library/candidates/rabbit-v3-cartoon-v2-mobile-lod0/asset.blend" \
            "$PWD/asset-library/roblox-receipts/s0910-rabbit/rabbit-native-proof.json" \
            "$PWD/dist/rabbit-v39-review" \
            "$PWD/dist/rabbit-v39-review"
      - name: Build frame sheets for visual review
        run: |
          python - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          out=Path('dist/rabbit-v39-review')
          for clip in ('idle','walk','run','scratchear'):
            for view in ('side','three-quarter'):
              files=sorted(out.glob(f'{clip}-{view}-*.png'))
              assert len(files)>=3,(clip,view)
              width,height=360,390
              sheet=Image.new('RGB',(width*len(files),height),(245,245,245))
              draw=ImageDraw.Draw(sheet)
              for i,file in enumerate(files):
                im=Image.open(file).convert('RGBA')
                im.thumbnail((width-12,height-42))
                bg=Image.new('RGBA',im.size,(245,245,245,255))
                bg.alpha_composite(im)
                sheet.paste(bg.convert('RGB'),(i*width+(width-im.width)//2,9))
                draw.text((i*width+9,height-23),f'{clip} {view} | pose {i+1}',fill=(24,24,24))
              sheet.save(out/f'CONTACT-{clip}-{view}.png')
          print('V39_SKIN_MESH_SHEETS_READY_NO_ROBLOX_UPLOAD')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rabbit-v39-real-mesh-contact-sheets-NOT-PUBLISHED
          path: dist/rabbit-v39-review/
          if-no-files-found: warn
