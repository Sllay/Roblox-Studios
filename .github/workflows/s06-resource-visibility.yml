name: S06.3 resource visibility and reversible material preview v2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/s06-resource-visibility.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - run: python tools/resource_visibility.py
      - run: python tools/resource_visibility_preview.py --plan dist/s06-3/plan.json --output dist/s06-3
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s06-3-preview
          path: dist/s06-3/
          if-no-files-found: warn
