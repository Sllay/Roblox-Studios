name: Staging readiness (read only)
on:
  workflow_dispatch:
    inputs:
      game:
        type: string
        default: mapa-principal
        required: true
      place:
        type: string
        default: main
        required: true
permissions:
  contents: read
jobs:
  readiness:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - name: Verify staging IDs and remote read access
        env:
          GAME: ${{ inputs.game }}
          PLACE: ${{ inputs.place }}
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/staging_readiness.py --game "$GAME" --place "$PLACE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-readiness
          path: dist/staging-readiness.json
          if-no-files-found: warn
