name: Asset Pack Inspector (read only)
on:
  workflow_dispatch:
    inputs:
      game:
        type: string
        default: mapa-principal
        required: true
      place:
        type: string
        default: main
        required: true
      asset_id:
        type: string
        default: '79689531752352'
        required: true
      selector_json:
        description: Optional exact candidate selector JSON array from pack.json
        type: string
        required: false
      sample:
        type: boolean
        default: true
  push:
    paths: ['games/maps/mapa-principal/docs/pack-inspector-once.trigger']
permissions:
  contents: read
jobs:
  inspect:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - name: Inventory and extract one detached sample
        env:
          GAME: ${{ inputs.game || 'mapa-principal' }}
          PLACE: ${{ inputs.place || 'main' }}
          ASSET: ${{ inputs.asset_id || '79689531752352' }}
          SAMPLE: ${{ inputs.sample }}
          SELECTOR: ${{ inputs.selector_json }}
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            args+=(--selector games/maps/mapa-principal/docs/tree-01-selector.json)
          elif [[ -n "$SELECTOR" ]]; then
            printf "%s" "$SELECTOR" > "$RUNNER_TEMP/selector.json"
            args+=(--selector "$RUNNER_TEMP/selector.json")
          elif [[ "$SAMPLE" == true ]]; then args+=(--sample); fi
          python tools/assets/pack.py --game "$GAME" --place "$PLACE" --asset-id "$ASSET" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asset-pack-inventory
          path: dist/asset-pack/
          if-no-files-found: warn
