name: S09.10 Rabbit V2 - author, publish and verify 4 native clips
on:
  push:
    branches: [feat/creature-factory-next]
    paths:
      - '.github/workflows/s0910-rabbit-animations-v2.yml'
      - 'tools/creature_factory/rabbit_animation_author_v2.py'
      - 'tools/creature_factory/rabbit_animation_upload_v2.py'
      - 'tests/test_rabbit_animation_v2.py'
      - 'games/maps/mapa-principal/game/places/main/src/ServerScriptService/CreatureFramework/RobloxMobAdapter.luau'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # The asset job also performs the guarded V33 staging save.
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install official Luau compiler
        run: |
          python -m pip install Pillow==11.3.0
          bash tools/install-luau.sh
      - name: Validate gait, scratch, actual rig and source
        run: |
          python tools/script_quality.py
          python -m unittest discover -s tests -p 'test_rabbit_animation_v2.py' -v
          luau tests/luau/rabbit_runtime.luau
      - name: Upload original clips with durable journals and detached playback test
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          git config user.name 'asset-factory[bot]'
          git config user.email 'asset-factory[bot]@users.noreply.github.com'
          python tools/creature_factory/rabbit_animation_upload_v2.py
      - name: Install native type analyzer for the changed runtime
        run: bash tools/install-luau-lsp.sh
      - name: Revalidate linked animation IDs before any Place write
        run: |
          python tools/script_quality.py
          python -m unittest discover -s tests -p 'test_rabbit_animation_v2.py' -v
          luau tests/luau/rabbit_runtime.luau
          root=games/maps/mapa-principal/game/places/main/src/ServerScriptService/CreatureFramework
          luau-lsp analyze --definitions="$RS_ROBLOX_DEFINITIONS" "$root/CreatureRegistry.luau" "$root/RobloxMobAdapter.luau"
      - name: Native V33 detached preview - no Place save
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/s0910_rabbit_v33_release.py --preview
      - name: Publish V33 only after every native gate passes
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/s0910_rabbit_v33_release.py --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s0910-rabbit-v2-animation-evidence
          path: |
            asset-library/candidates/rabbit-v3-cartoon-v2-mobile-lod0/native-animations-v2/
            asset-library/roblox-receipts/s0910-rabbit-v2/
            dist/s0910-rabbit-v33-stage/
            games/maps/mapa-principal/docs/s09/publication-rabbit-v33.json
          if-no-files-found: warn
