name: S09.10 Rabbit neural candidate V3
on:
  push:
    branches: [feat/s0910-wildlife]
    paths:
      - '.github/workflows/s0910-rabbit-neural.yml'
      - 'tools/creature_factory/rabbit_neural*.py'
      - 'tools/creature_factory/tsr_cpu_marching_cubes.py'
      - 'asset-library/creature-queue/rabbit-v3.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s0910-rabbit-neural
  cancel-in-progress: false
jobs:
  neural:
    if: github.ref == 'refs/heads/feat/s0910-wildlife'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate creative contract and reject V1 and V2 promotion
        run: |
          python tools/creature_factory/test_organic_contract.py
          if python tools/asset_factory/promote_candidate.py --candidate rabbit-v1-43678677522-1 --asset rabbit-v1 --revision test --approval invalid --file asset.glb; then exit 1; fi
          if python tools/asset_factory/promote_candidate.py --candidate rabbit-v2-43679757855-1 --asset rabbit-v2 --revision test --approval invalid --file asset.glb; then exit 1; fi
      - name: Install pinned CPU reconstruction environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 scipy==1.13.1 scikit-image==0.24.0 Pillow==10.4.0 einops==0.7.0 omegaconf==2.3.0 transformers==4.35.2 huggingface-hub==0.26.5 trimesh==4.4.9 fast-simplification==0.1.11 xatlas==0.0.9 imageio==2.35.1 rembg==2.0.60 onnxruntime==1.19.2 opencv-python-headless==4.10.0.84
          python -m pip check
          git clone https://github.com/VAST-AI-Research/TripoSR.git "$RUNNER_TEMP/TripoSR"
          git -C "$RUNNER_TEMP/TripoSR" checkout 107cefdc244c39106fa830359024f6a2f1c78871
          sudo apt-get update
          sudo apt-get install -y blender xvfb libgl1-mesa-dri
      - name: Download verified open weights and reconstruct from approved hero
        run: python -u tools/creature_factory/rabbit_neural_inference.py --upstream "$RUNNER_TEMP/TripoSR" --out dist/creature/rabbit-v3 --resolution 192
      - name: Bake Blender candidate, add six whiskers and render
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a blender -b --factory-startup --python-exit-code 1 --python tools/creature_factory/rabbit_neural_blender.py -- "$PWD/dist/creature/rabbit-v3"
      - name: Compare silhouette against original concept sheet
        id: audit
        continue-on-error: true
        run: python tools/creature_factory/rabbit_organic_reference.py audit dist/creature/rabbit-v3
      - name: Archive candidate without promotion
        if: steps.audit.outcome == 'success' || steps.audit.outcome == 'failure'
        run: |
          set -euo pipefail
          revision="asset-library/candidates/rabbit-v3-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -f dist/creature/rabbit-v3/neural-mesh.npz dist/creature/rabbit-v3/runtime-mesh.npz
          python tools/asset_factory/persist_candidates.py dist/creature/rabbit-v3 "$revision"
          git config user.name 'asset-factory[bot]'
          git config user.email 'asset-factory[bot]@users.noreply.github.com'
          git add "$revision"
          git commit -m "assets(s0910): archive neural rabbit candidate ${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            git fetch origin feat/s0910-wildlife
            git rebase origin/feat/s0910-wildlife
            if git push origin HEAD:refs/heads/feat/s0910-wildlife; then exit 0; fi
            sleep 5
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s0910-rabbit-v3-neural
          path: dist/creature/rabbit-v3/
          if-no-files-found: warn
      - name: Enforce silhouette gate
        if: steps.audit.outcome == 'failure'
        run: exit 1
