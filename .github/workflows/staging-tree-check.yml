name: Staging tree access verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - name: Verify staging identity
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          python tools/deploy.py validate
          python tools/staging_readiness.py --game mapa-principal --place main
      - name: Audit selected tree pack (read only)
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          python tools/assets/access.py --game mapa-principal --place main --environment staging --asset-id 79689531752352
          python -c 'import json; d=json.load(open("dist/asset-access/summary.json")); r=d["results"][0]; print("ACCESS",r["status"]); a=r.get("auditReport",{}).get("audit",{}); print("AUDIT",json.dumps({k:v for k,v in a.items() if k!="signature"}))'
      - name: Collect staging structure
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/scene_snapshot.py --game mapa-principal --place main --environment staging
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-tree-verification
          path: |
            dist/staging-readiness.json
            dist/asset-access/
            dist/snapshot/
          if-no-files-found: warn
