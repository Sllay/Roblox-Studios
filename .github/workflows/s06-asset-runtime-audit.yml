name: S06.5 installed asset compatibility audit v2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/s06-asset-runtime-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - run: python tools/asset_runtime_audit.py
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s06-5-asset-audit
          path: dist/s06-5/
          if-no-files-found: warn
