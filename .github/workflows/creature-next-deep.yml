name: Creature Factory Next C2 deep correspondence CPU
on:
  pull_request:
    paths:
      - 'tools/creature_factory/next/deep_correspondence.py'
      - 'tools/creature_factory/next/deep_benchmark.py'
      - 'tests/test_creature_next_deep.py'
      - '.github/workflows/creature-next-deep.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  deep:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.48.3 Pillow==11.3.0 numpy==1.26.4 safetensors==0.5.3 opencv-python-headless==4.11.0.86
      - name: Test descriptor matching and geometry
        run: python -m unittest tests.test_creature_next_deep tests.test_creature_next_hull -v
      - name: Restore verified model and evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dino"
          base="https://huggingface.co/facebook/dinov2-small/resolve/150c8e7"
          for f in config.json model.safetensors; do
            curl --fail --silent --show-error --location --retry 2 "$base/$f?download=true" -o "$RUNNER_TEMP/dino/$f"
          done
          echo "ae1e99fcefd534ed978cdeb8326f08030c96e28b7a81ffcbc98a857c84d14be1  $RUNNER_TEMP/dino/model.safetensors" | sha256sum -c -
          for pair in "14190612099 87eb505f4efaee2f58412844834e77523dda45a42cd42e795d1ca3da77b20f60 c1" "14191062045 230dc0856c282900ab722eaf9403e51f7395e849419907ed2fe6e56404ded36b ab" "14191840234 b970259960b85d4adf3e1130f61da7daff400840e3c0a0b800e4bce5775ffa01 depth" "14199332483 10f4bbdeeb8653c358bf780df51b7c5db5d99ebbe3afaffa91d5abf059880b95 hull"; do
            read -r id hash name <<< "$pair"
            curl --fail --location --silent --show-error --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/Sllay/Roblox-Studios/actions/artifacts/$id/zip" -o "$RUNNER_TEMP/$name.zip"
            echo "$hash  $RUNNER_TEMP/$name.zip" | sha256sum -c -
            unzip -q "$RUNNER_TEMP/$name.zip" -d "$RUNNER_TEMP/$name"
          done
      - name: Benchmark real deep descriptors and SIFT
        run: python -u -m tools.creature_factory.next.deep_benchmark "$RUNNER_TEMP/c1/c1-ci" "$RUNNER_TEMP/ab" "$RUNNER_TEMP/hull/c2hull" "$RUNNER_TEMP/depth" "$RUNNER_TEMP/dino" dist/creature-next/c2deep
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creature-next-c2deep
          path: dist/creature-next/c2deep/
          if-no-files-found: warn
