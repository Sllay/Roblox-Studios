name: S05 coupled environment transaction preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/s05-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roblox-place-write-mapa-principal-main-staging
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - run: python -m unittest discover -s tests -v
      - run: python tools/p45_transaction.py preview
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s05-reviewed-preview
          path: dist/s05/
          if-no-files-found: warn
