name: Asset visual memory (component evidence)
on:
  workflow_dispatch:
    inputs:
      game:
        type: string
        default: mapa-principal
        required: true
      place:
        type: string
        default: main
        required: true
      asset_id:
        type: string
        default: '79689531752352'
        required: true
  push:
    paths: ['games/maps/mapa-principal/docs/visual-memory-once.trigger']
permissions:
  contents: read
jobs:
  catalog:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - name: Collect actual model component metadata
        env:
          GAME: ${{ inputs.game || 'mapa-principal' }}
          PLACE: ${{ inputs.place || 'main' }}
          ASSET: ${{ inputs.asset_id || '79689531752352' }}
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/assets/pack.py --game "$GAME" --place "$PLACE" --asset-id "$ASSET"
      - name: Fetch official mesh thumbnails and build visual memory
        run: python tools/assets/visual_memory.py --inventory dist/asset-pack/pack.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-memory-evidence
          path: |
            dist/visual-memory/
            dist/asset-pack/pack.json
          if-no-files-found: warn
