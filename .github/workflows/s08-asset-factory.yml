name: S08 Asset Factory P1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/asset_factory/**'
      - '.github/workflows/s08-asset-factory.yml'
permissions:
  contents: read
jobs:
  author:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and software graphics
        run: |
          sudo apt-get update
          sudo apt-get install -y blender xvfb libgl1-mesa-dri python3-numpy python3-pil python3-scipy python3-skimage
          blender --version
          blender -b --python-exit-code 1 --python-expr 'import numpy; print(numpy.__version__)'
      - name: Author and render
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python3 tools/asset_factory/run.py --job tools/asset_factory/jobs/p1-smoke.json --out dist/asset-factory/p1-smoke
      - name: Reconstruct multiview PNG fixture
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a blender -b --factory-startup --python-exit-code 1 --python tools/asset_factory/p2_probe.py -- "$PWD/dist/asset-factory/p2"
      - name: Reconstruct color references
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a blender -b --factory-startup --python-exit-code 1 --python tools/asset_factory/p2_color_probe.py -- "$PWD/dist/asset-factory/p2-color"
      - name: Refine organic and hard surfaces
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a blender -b --factory-startup --python-exit-code 1 --python tools/asset_factory/p2_refine_probe.py -- "$PWD/dist/asset-factory/p2-refine"
      - name: Project multiview textures
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a blender -b --factory-startup --python-exit-code 1 --python tools/asset_factory/p2_texture_probe.py -- "$PWD/dist/asset-factory/p2-texture"
      - name: Continuous hull benchmark
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a blender -b --factory-startup --python-exit-code 1 --python tools/asset_factory/p2_smooth_probe.py -- "$PWD/dist/asset-factory/p2-smooth"
      - name: Compare geometry budgets
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a blender -b --factory-startup --python-exit-code 1 --python tools/asset_factory/p2_budget_probe.py -- "$PWD/dist/asset-factory/p2-budget"
      - name: Recover parametric handle
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a blender -b --factory-startup --python-exit-code 1 --python tools/asset_factory/p2_handle_probe.py -- "$PWD/dist/asset-factory/p2-handle"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s08-p1-smoke
          path: dist/asset-factory/
          if-no-files-found: warn
