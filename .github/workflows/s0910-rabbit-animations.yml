name: S09.10 Rabbit animation clips - upload and native playback
on:
  push:
    branches: [feat/creature-factory-next]
    paths:
      - '.github/workflows/s0910-rabbit-animations.yml'
      - 'tools/creature_factory/rabbit_animation_author.py'
      - 'tools/creature_factory/rabbit_animation_upload.py'
      - 'tools/sync/s0910_rabbit_animation_probe.luau'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s0910-rabbit-animation-assets
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: bash tools/install-luau.sh
      - name: Author, journal, upload and verify original rabbit animations
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          git config user.name 'asset-factory[bot]'
          git config user.email 'asset-factory[bot]@users.noreply.github.com'
          python tools/creature_factory/rabbit_animation_upload.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s0910-rabbit-animation-evidence
          path: |
            asset-library/candidates/rabbit-v3-cartoon-v2-mobile-lod0/native-animations/
            asset-library/roblox-receipts/s0910-rabbit/
          if-no-files-found: warn
