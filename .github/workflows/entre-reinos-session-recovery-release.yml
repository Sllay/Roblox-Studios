name: Entre Reinos T1-R1 session recovery staging release (single approved fix)
on:
  push:
    branches: [main]
    paths: [.github/workflows/entre-reinos-session-recovery-release.yml]
permissions:
  actions: write
  contents: write
concurrency:
  group: roblox-place-write-entre-reinos-main-staging
  cancel-in-progress: false
jobs:
  stage:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - name: Verify exact staging target and reviewed recovery code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("games/maps/entre-reinos")
          targets=json.loads((root/"deploy.targets.json").read_text())["environments"]
          assert str(targets["staging"]["universeId"])=="10769712413"
          assert str(targets["staging"]["placeIds"]["main"])=="90623742498445"
          assert targets["production"]["universeId"] is None
          assert targets["production"]["placeIds"]["main"] is None
          assert json.loads((root/"game.manifest.json").read_text())["places"][0]["fullPlaceBuildAuthoritative"]
          boot=(root/"game/places/main/src/ServerScriptService/Boot.server.luau").read_text()
          slot=(root/"game/places/main/src/ServerScriptService/Services/SaveSlotService.luau").read_text()
          ui=(root/"game/places/main/src/StarterPlayer/StarterPlayerScripts/SlotMenu.luau").read_text()
          assert 'action == "resume"' in boot
          assert 'return resume(player, index)' in boot
          assert 'SaveSlotService.abortActivation(player)' in boot
          assert 'function SaveSlotService.index(' in slot
          assert 'request("resume", index)' in ui
          print("SESSION_RECOVERY_REVIEWED")
          PY
          conclusion="$(gh api repos/Sllay/Roblox-Studios/actions/runs/44977827154 --jq .conclusion)"
          [[ "$conclusion" == success ]] || { echo "::error::Recovery CI not green"; exit 1; }
      - name: Capture published v3 baseline before replacing only staging
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          python tools/scene_sync.py --game entre-reinos --place main --environment staging --expected-version 3 --record
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path("games/maps/entre-reinos/docs/sync/main/staging.summary.json").read_text())
          assert summary["loadedVersion"]==3
          assert str(summary["universeId"])=="10769712413"
          assert str(summary["placeId"])=="90623742498445"
          assert summary["total"]>=60
          roots={r["name"] for r in summary["workspaceRoots"]}
          assert "StartArea" in roots and "Baseplate" not in roots
          print("STAGING_V3_READONLY_BASELINE_PASS",summary["stateDigest"])
          PY
      - name: Save observed baseline in Git without rewriting player data
        run: |
          git config user.name "entre-reinos-recovery[bot]"
          git config user.email "entre-reinos-recovery@users.noreply.github.com"
          git add -- games/maps/entre-reinos/docs/sync/main/staging.json games/maps/entre-reinos/docs/sync/main/staging.summary.json
          if ! git diff --cached --quiet; then
            git commit -m "sync(entre-reinos): record observed published staging v3 before session recovery fix"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Dispatch guarded official staging-only publish workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(git rev-parse HEAD)"
          remote="$(gh api repos/Sllay/Roblox-Studios/git/ref/heads/main --jq .object.sha)"
          [[ "$head" == "$remote" ]] || { echo "::error::Branch changed; refusing publish"; exit 1; }
          gh api -X POST repos/Sllay/Roblox-Studios/actions/workflows/publish.yml/dispatches --input - <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "game": "entre-reinos",
              "place": "main",
              "environment": "staging",
              "confirm_publish": "true",
              "confirm_full_place_replacement": "true"
            }
          }
          JSON
          echo "SESSION_RECOVERY_STAGING_DISPATCHED"
